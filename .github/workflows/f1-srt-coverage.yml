name: F1 SRT coverage audit

on:
  push:
    branches: [feature/collect-f1-threshold5-20261028, automation/f1-batch-004-20261028]
    paths:
      - '.github/workflows/f1-srt-coverage.yml'
      - 'frontend/vue3/cupitor-frontend/tools/language/**'
      - 'frontend/vue3/cupitor-frontend/public/language/rare-words.js'
  workflow_dispatch:
    inputs:
      collect:
        description: 'Capture one bounded F1 batch (requires stored GitHub Actions secrets)'
        type: boolean
        default: false
      start:
        description: 'Skip this many currently under-covered words (0-based)'
        type: number
        default: 0
      chunk:
        description: 'Maximum words in this batch'
        type: number
        default: 10

permissions:
  contents: read

concurrency:
  group: f1-srt-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Cupitor tool
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - name: Check out Swedish SRT library
        uses: actions/checkout@v4
        with:
          repository: trexsatya/trexsatya.github.io
          ref: gh-pages
          path: data
          token: ${{ secrets.PAGES_DEPLOY_TOKEN || github.token }}
          persist-credentials: true
          sparse-checkout: |
            db/language/swedish/srts
            db/language/swedish/vocabulary.txt
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Smoke-test collection matching
        working-directory: source/frontend/vue3/cupitor-frontend
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { planCollection } from './tools/language/collect-plan.js';
          const samples = [
            { videoId: 'a1234567890', sv: 'Vi kan streta emot.', en: 'Fine' },
            { videoId: 'a1234567890', sv: 'Streta emot något.', en: 'Okay' },
            { videoId: 'b1234567890', sv: 'Annat här.', en: 'We streta.' },
          ];
          const sv = planCollection([{line:'streta'}], samples, 5, {sourceLang:'sv'});
          assert.equal(sv[0].count, 1, 'one indexed Swedish video, despite duplicate bundles');
          assert.equal(sv[0].missing, 4);
          assert.deepEqual(sv[0].existingVideoIds, ['a1234567890']);
          const en = planCollection([{line:'streta'}], samples, 5, {sourceLang:'en'});
          assert.equal(en[0].count, 1, 'English-only mention does not affect Swedish count');
          console.log('Coverage matching smoke test passed');
          NODE

      - name: Plan all F1 deficits at a threshold of five
        working-directory: source/frontend/vue3/cupitor-frontend
        run: |
          node tools/language/lang-manage.js collect \
            --wordsFile tools/language/word-lists/f1.txt \
            --threshold 5 --chunk 0 --dry-run \
            --dataDir "$GITHUB_WORKSPACE/data/db/language/swedish" \
            --srtsDir "$GITHUB_WORKSPACE/data/db/language/swedish/srts" \
            --outDir "$RUNNER_TEMP/f1-srt-collection"

      - name: Summarize deficits
        if: success()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/f1-srt-collection/collect-plan.json', 'utf8'));
          const h = Object.fromEntries([0,1,2,3,4,5].map(k => [k, 0]));
          let needed = 0;
          for (const w of p.selected) {
            h[w.count] = (h[w.count] || 0) + 1;
            needed += w.missing;
          }
          console.log(JSON.stringify({ threshold: p.threshold, underCovered: p.selected.length, totalAdditionalVideosNeeded: needed, existingSourceCounts: h }, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## f1 threshold-5 coverage\n\nUnder-covered terms: **' + p.selected.length +
            '**. Additional distinct video matches needed: **' + needed + '**.\n\n');
          NODE

      - name: Save f1 coverage plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-srt-coverage-plan
          path: ${{ runner.temp }}/f1-srt-collection/collect-plan.json
          if-no-files-found: warn
          retention-days: 14

      # Collection is never started by a push or by a coverage-only run.
      # Secrets are only passed to the live capture step, never to the audit.
      - name: Require secure Filmot and publishing credentials
        if: (github.event_name == 'workflow_dispatch' && inputs.collect) || (github.event_name == 'push' && github.ref == 'refs/heads/automation/f1-batch-004-20261028' && contains(github.event.head_commit.message, '[start-f1-batch-004]'))
        env:
          FILMOT_API_KEY: ${{ secrets.FILMOT_API_KEY }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [[ -z "$FILMOT_API_KEY" ]]; then
            echo '::error::Add FILMOT_API_KEY as a Cupitor Actions secret; do not paste it into YAML or logs.'
            exit 1
          fi
          if [[ -z "$PAGES_DEPLOY_TOKEN" ]]; then
            echo '::error::Add PAGES_DEPLOY_TOKEN for writes to trexsatya.github.io.'
            exit 1
          fi

      - name: Open or resume isolated data branch
        if: (github.event_name == 'workflow_dispatch' && inputs.collect) || (github.event_name == 'push' && github.ref == 'refs/heads/automation/f1-batch-004-20261028' && contains(github.event.head_commit.message, '[start-f1-batch-004]'))
        working-directory: data
        run: |
          if git ls-remote --exit-code --heads origin 'refs/heads/ai/f1-srt-threshold5' >/dev/null; then
            git fetch origin 'refs/heads/ai/f1-srt-threshold5'
            git checkout -B ai/f1-srt-threshold5 FETCH_HEAD
          else
            git checkout -b ai/f1-srt-threshold5
          fi

      - name: Restore successful Filmot API response cache
        if: (github.event_name == 'workflow_dispatch' && inputs.collect) || (github.event_name == 'push' && github.ref == 'refs/heads/automation/f1-batch-004-20261028' && contains(github.event.head_commit.message, '[start-f1-batch-004]'))
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/f1-srt-collection/filmot-api-cache
          key: filmot-f1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            filmot-f1-${{ runner.os }}-

      - name: Collect one Filmot batch (source subtitles only)
        id: capture
        if: (github.event_name == 'workflow_dispatch' && inputs.collect) || (github.event_name == 'push' && github.ref == 'refs/heads/automation/f1-batch-004-20261028' && contains(github.event.head_commit.message, '[start-f1-batch-004]'))
        working-directory: source/frontend/vue3/cupitor-frontend
        env:
          FILMOT_API_KEY: ${{ secrets.FILMOT_API_KEY }}
        run: |
          node tools/language/lang-manage.js collect \
            --wordsFile tools/language/word-lists/f1.txt \
            --threshold 5 --start "${{ inputs.start || 18 }}" --chunk "${{ inputs.chunk || 20 }}" \
            --api --no-translate --apiCredits 15 \
            --dataDir "$GITHUB_WORKSPACE/data/db/language/swedish" \
            --srtsDir "$GITHUB_WORKSPACE/data/db/language/swedish/srts" \
            --outDir "$RUNNER_TEMP/f1-srt-collection"

      # Keep successful captures even if a later Filmot query exhausts quota.
      - name: Save captured SRT packs to isolated review branch
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.collect) || (github.event_name == 'push' && github.ref == 'refs/heads/automation/f1-batch-004-20261028' && contains(github.event.head_commit.message, '[start-f1-batch-004]')))
        working-directory: data
        run: |
          if [[ "$(git branch --show-current)" != "ai/f1-srt-threshold5" ]]; then
            echo 'Data review branch not initialized; no data published.'
            exit 1
          fi
          git add db/language/swedish/srts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Capture f1 Swedish SRT examples toward five distinct videos per word'
            git push origin HEAD:refs/heads/ai/f1-srt-threshold5
          else
            echo 'No new SRTs to commit.'
          fi

      - name: Save collection progress and errors
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.collect) || (github.event_name == 'push' && github.ref == 'refs/heads/automation/f1-batch-004-20261028' && contains(github.event.head_commit.message, '[start-f1-batch-004]')))
        uses: actions/upload-artifact@v4
        with:
          name: f1-srt-batch-report
          path: |
            ${{ runner.temp }}/f1-srt-collection/collect-plan.json
            ${{ runner.temp }}/f1-srt-collection/collect-results.json
          if-no-files-found: warn
          retention-days: 30
