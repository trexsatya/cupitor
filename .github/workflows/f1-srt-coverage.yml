name: F1 Swedish SRT coverage and auto-collection

on:
  push:
    branches: [feature/auto-resume-f1-srt-20261028]
    paths:
      - .github/workflows/f1-srt-coverage.yml
      - frontend/vue3/cupitor-frontend/tools/language/**
  workflow_dispatch:
    inputs:
      collect:
        description: 'Automatically collect unfinished F1 words (otherwise only audit)'
        required: true
        type: boolean
        default: false
      budget:
        description: 'Maximum new Filmot credits for the entire run'
        required: true
        type: number
        default: 100
      batch_size:
        description: 'Words to process before each saved checkpoint'
        required: true
        type: number
        default: 20
      max_words:
        description: 'Maximum attempted words in this run'
        required: true
        type: number
        default: 120
      skip_after:
        description: 'Skip a word after this many searches with no new videos'
        required: true
        type: number
        default: 2

permissions:
  contents: read

# Never allow two runs to write the same review branch concurrently.
concurrency:
  group: f1-auto-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out Cupitor tools
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - name: Check out current published SRTs
        uses: actions/checkout@v4
        with:
          repository: trexsatya/trexsatya.github.io
          ref: gh-pages
          fetch-depth: 0
          path: data
          token: ${{ secrets.PAGES_DEPLOY_TOKEN || github.token }}
          persist-credentials: true
          sparse-checkout: |
            db/language/swedish/srts
            db/language/swedish/vocabulary.txt
            db/language/swedish/srt-collection
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test auto-resume selection and credit safety
        working-directory: source/frontend/vue3/cupitor-frontend
        run: |
          node --test tools/language/collect-auto.test.mjs tools/language/filmot-budget.test.mjs
          node --check tools/language/collect-auto.js
          node --check tools/language/lang-manage.js
          node --check tools/language/filmot-api.js

      - name: Audit current published F1 SRT coverage
        working-directory: source/frontend/vue3/cupitor-frontend
        run: |
          node tools/language/lang-manage.js collect \
            --wordsFile tools/language/word-lists/f1.txt \
            --threshold 5 --chunk 0 --dry-run \
            --dataDir "$GITHUB_WORKSPACE/data/db/language/swedish" \
            --srtsDir "$GITHUB_WORKSPACE/data/db/language/swedish/srts" \
            --outDir "$RUNNER_TEMP/f1-auto"

      - name: Verify automatic batch selection in no-API dry run
        working-directory: source/frontend/vue3/cupitor-frontend
        run: |
          node tools/language/collect-auto.js \
            --wordsFile tools/language/word-lists/f1.txt \
            --dataDir "$GITHUB_WORKSPACE/data/db/language/swedish" \
            --outDir "$RUNNER_TEMP/f1-auto" \
            --dryRun true

      - name: Verify secure credentials
        if: github.event_name == 'workflow_dispatch' && inputs.collect
        env:
          FILMOT_API_KEY: ${{ secrets.FILMOT_API_KEY }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [[ -z "$FILMOT_API_KEY" || -z "$PAGES_DEPLOY_TOKEN" ]]; then
            echo "::error::FILMOT_API_KEY and PAGES_DEPLOY_TOKEN are required as GitHub Actions secrets."
            exit 1
          fi

      - name: Create or resume a review branch from gh-pages
        id: branch
        if: github.event_name == 'workflow_dispatch' && inputs.collect
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        working-directory: data
        run: |
          set -euo pipefail
          EXISTING="$(gh pr list --repo trexsatya/trexsatya.github.io --state open --limit 100 \
            --json headRefName,title \
            --jq '[.[] | select(.headRefName | startswith("ai/f1-srt-threshold5-auto-")) | .headRefName] | first // ""')"
          if [[ -n "$EXISTING" ]]; then
            echo "Resuming existing open F1 collection PR branch: $EXISTING"
            git fetch origin "refs/heads/$EXISTING:refs/remotes/origin/$EXISTING"
            git switch --create "$EXISTING" "refs/remotes/origin/$EXISTING"
            git fetch origin "refs/heads/gh-pages:refs/remotes/origin/gh-pages"
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                merge --no-edit origin/gh-pages
            DATA_BRANCH="$EXISTING"
          else
            DATA_BRANCH="ai/f1-srt-threshold5-auto-${{ github.run_id }}"
            echo "Starting a new review branch from merged gh-pages: $DATA_BRANCH"
            git switch --create "$DATA_BRANCH"
          fi
          echo "DATA_BRANCH=$DATA_BRANCH" >> "$GITHUB_ENV"

      - name: Auto-collect, checkpoint and push each batch
        if: github.event_name == 'workflow_dispatch' && inputs.collect
        working-directory: source/frontend/vue3/cupitor-frontend
        env:
          FILMOT_API_KEY: ${{ secrets.FILMOT_API_KEY }}
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          node tools/language/collect-auto.js \
            --wordsFile tools/language/word-lists/f1.txt \
            --dataDir "$GITHUB_WORKSPACE/data/db/language/swedish" \
            --gitDir "$GITHUB_WORKSPACE/data" \
            --outDir "$RUNNER_TEMP/f1-auto" \
            --branch "$DATA_BRANCH" \
            --threshold 5 \
            --budget "${{ inputs.budget }}" \
            --batchSize "${{ inputs.batch_size }}" \
            --maxWords "${{ inputs.max_words }}" \
            --maxNoYield "${{ inputs.skip_after }}"

      - name: Open or update the F1 subtitle review pull request
        if: always() && github.event_name == 'workflow_dispatch' && inputs.collect && steps.branch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          if [[ "$(git rev-list --count origin/gh-pages..HEAD)" == "0" ]]; then
            echo "No changes to review."
            exit 0
          fi
          URL="$(gh pr list --repo trexsatya/trexsatya.github.io --head "$DATA_BRANCH" --state open \
            --json url --jq '.[0].url // ""' || true)"
          if [[ -z "$URL" ]]; then
            URL="$(gh pr create --repo trexsatya/trexsatya.github.io --base gh-pages \
              --head "$DATA_BRANCH" --title 'Review automatic F1 Swedish SRT captures (5 videos per word)' \
              --body 'Resumable F1 subtitle collection. Generated Swedish SRT packs and progress state are checkpointed after each batch. Review before merging.' 2>&1)" || {
                echo "::warning::Could not create review PR. Check whether PAGES_DEPLOY_TOKEN has Pull requests: Read and write permission."
                echo "Create a PR from $DATA_BRANCH to gh-pages in trexsatya/trexsatya.github.io."
                exit 0
              }
          fi
          echo "Review PR: $URL"
          echo "### Review captions" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the latest collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-auto-collection-report
          path: |
            ${{ runner.temp }}/f1-auto/auto-summary.json
            ${{ runner.temp }}/f1-auto/collect-plan.json
            ${{ runner.temp }}/f1-auto/collect-results.json
            ${{ runner.temp }}/f1-auto/collect-metrics.json
          if-no-files-found: warn
          retention-days: 30
