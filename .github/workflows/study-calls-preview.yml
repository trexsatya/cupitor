name: Study calls UI preview
on:
  pull_request:
    branches: [music-study-app]
    paths:
      - frontend/vue3/cupitor-frontend/public/language/study-calls*
      - frontend/vue3/cupitor-frontend/public/language.css
      - frontend/vue3/cupitor-frontend/tests/browser/study-calls.cjs
      - .github/workflows/study-calls-preview.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study-calls-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/vue3/cupitor-frontend
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      TZ: Europe/Stockholm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/vue3/cupitor-frontend/package-lock.json
      - name: Install dependencies without downloading another browser
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Verify Study calls and capture mobile and desktop screenshots
        run: node tests/browser/study-calls.cjs
      - name: Save screenshots for design review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: study-calls-ui-preview
          path: frontend/vue3/cupitor-frontend/test-results/dialog-browser-results/study-calls/
          if-no-files-found: warn
          retention-days: 14
