name: Sveriges Radio subtitles

on:
  workflow_dispatch:
    inputs:
      episode_url:
        description: Sveriges Radio episode URL
        required: true
        default: https://www.sverigesradio.se/avsnitt/repris-kaffe-hot-eller-bot-for-halsan
  pull_request:
    paths: [.github/workflows/sveriges-radio-srt.yml]

permissions:
  contents: read

jobs:
  transcribe:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/sr-subtitle-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EPISODE_URL: ${{ inputs.episode_url || 'https://www.sverigesradio.se/avsnitt/repris-kaffe-hot-eller-bot-for-halsan' }}
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install numpy faster-whisper yt-dlp
      - name: Check Sveriges Radio public API
        run: |
          python - <<'PY'
          import json, urllib.request
          url = 'https://api.sr.se/api/v2/episodes?programid=1272&fromdate=2024-07-09&todate=2024-07-10&format=json&size=100'
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = json.load(response)
              for episode in data.get('episodes', []):
                  print(json.dumps(episode, ensure_ascii=False))
              with urllib.request.urlopen('https://api.sr.se/api/v2/episodes/2397267?format=json', timeout=30) as response:
                  print('FULL_EPISODE', json.dumps(json.load(response), ensure_ascii=False))
          except Exception as exc:
              print('Public API unavailable:', exc)
          PY
      - name: Download audio
        run: |
          mkdir -p output
          python -m yt_dlp --no-playlist -x --audio-format mp3 -o 'output/episode.%(ext)s' -- "$EPISODE_URL"
          test -s output/episode.mp3
      - name: Generate Swedish subtitles
        run: |
          python -u frontend/vue3/cupitor-frontend/tools/language/make-srt.py output/episode.mp3 -l sv -o output/episode.srt
          test -s output/episode.srt
      - name: Upload audio and subtitles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sveriges-radio-episode
          path: output/
          if-no-files-found: warn
          retention-days: 7
