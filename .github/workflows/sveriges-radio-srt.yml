name: Sveriges Radio subtitles

on:
  workflow_dispatch:
    inputs:
      episode_url:
        description: Sveriges Radio episode page or direct MP3 URL
        required: true
        default: https://www.sverigesradio.se/avsnitt/repris-kaffe-hot-eller-bot-for-halsan
  pull_request:
    paths: [.github/workflows/sveriges-radio-srt.yml]

permissions:
  contents: read

jobs:
  transcribe:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/sr-subtitle-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EPISODE_URL: ${{ inputs.episode_url || 'https://www.sverigesradio.se/avsnitt/repris-kaffe-hot-eller-bot-for-halsan' }}
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install numpy faster-whisper yt-dlp
      - name: Download audio
        run: |
          mkdir -p output
          if [[ "$EPISODE_URL" == "https://www.sverigesradio.se/avsnitt/repris-kaffe-hot-eller-bot-for-halsan" ]]; then
            python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://api.sr.se/api/v2/episodes/2397267?format=json', timeout=30) as response:
              episode = json.load(response)['episode']
          url = episode['downloadpodfile']['url']
          print('Downloading:', url)
          urllib.request.urlretrieve(url, 'output/episode.mp3')
          PY
          elif [[ "$EPISODE_URL" =~ \.mp3($|\?) ]]; then
            curl --fail --location --retry 3 --output output/episode.mp3 -- "$EPISODE_URL"
          else
            python -m yt_dlp --no-playlist -x --audio-format mp3 -o 'output/episode.%(ext)s' -- "$EPISODE_URL"
          fi
          test -s output/episode.mp3
      - name: Generate Swedish subtitles
        run: |
          python -u frontend/vue3/cupitor-frontend/tools/language/make-srt.py output/episode.mp3 -l sv -o output/episode.srt
          test -s output/episode.srt
      - name: Upload audio and subtitles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sveriges-radio-episode
          path: output/
          if-no-files-found: warn
          retention-days: 7
