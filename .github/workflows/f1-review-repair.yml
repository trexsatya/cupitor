name: Apply F1 review-branch subtitle repair

on:
  push:
    branches: [fix/f1-orphan-caption-bundle-collision-20261028]
    paths:
      - '.github/workflows/f1-review-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[apply-f1-review-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested repair implementation
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - name: Check out SRT review branch (not published data)
        uses: actions/checkout@v4
        with:
          repository: trexsatya/trexsatya.github.io
          ref: ai/f1-srt-threshold5
          path: data
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          persist-credentials: true
          sparse-checkout: |
            db/language/swedish/srts
          sparse-checkout-cone-mode: false

      - name: Validate focused repair tests
        working-directory: source/frontend/vue3/cupitor-frontend
        run: node --test public/language/subtitle-bundles.test.mjs tools/language/bundle-repair.test.mjs

      - name: Safely repair only the known duplicate while preserving backup
        working-directory: source/frontend/vue3/cupitor-frontend
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {planBundleRepair, applyBundleRepair} from './tools/language/bundle-repair.js';
          import {readSubtitleFiles} from './tools/language/bundle-store.js';
          const dir = process.env.GITHUB_WORKSPACE + '/data/db/language/swedish/srts';
          const plan = planBundleRepair(dir, {preferIndexed: true});
          if (plan.blocked) throw new Error('Repair blocked: ' + JSON.stringify(plan.summary.conflicts));
          if (plan.summary.duplicates.length !== 1 ||
              !plan.summary.duplicates[0].file.includes('Y4S4WZ0vj0w.sv.srt')) {
            throw new Error('Unexpected duplicate scope; refused: ' + JSON.stringify(plan.summary.duplicates));
          }
          const allowed = new Set(['packs/pack-000012.json', 'packs/pack-000115.json', 'storage.json', 'index.json']);
          if (plan.summary.changedFiles.some(name => !allowed.has(name))) {
            throw new Error('Unexpected repair file scope: ' + JSON.stringify(plan.summary.changedFiles));
          }
          const result = applyBundleRepair(plan);
          readSubtitleFiles(dir, {includeLoose:false});
          console.log(JSON.stringify({applied:true, duplicateTracks:result.duplicateTracks,
            affectedMedia:result.affectedMedia, changedFiles:result.changedFiles, backup:result.backup}, null, 2));
          writeFileSync(process.env.RUNNER_TEMP + '/f1-repair-result.json',
            JSON.stringify({applied:true, summary:result}, null, 2) + '\n');
          NODE

      - name: Commit repaired SRT bundles to review branch only
        working-directory: data
        run: |
          git add db/language/swedish/srts
          if git diff --cached --quiet; then
            echo 'No repair changes.'
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Reattach orphaned English and remove duplicate Swedish SRT track'
            git push origin HEAD:refs/heads/ai/f1-srt-threshold5
          fi

      - name: Upload repair backup and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-review-repair-backup
          path: |
            data/db/language/swedish/srts-repair-backup-*/
            ${{ runner.temp }}/f1-repair-result.json
          if-no-files-found: warn
          retention-days: 30
