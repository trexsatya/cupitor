name: Test and deploy frontend

on:
  push:
    branches: [music-study-app]
    paths:
      - frontend/vue3/cupitor-frontend/**
      - .github/workflows/deploy-site.yml
  pull_request:
    branches: [music-study-app]
    paths:
      - frontend/vue3/cupitor-frontend/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cupitor-${{ github.event_name == 'pull_request' && github.ref || 'gh-pages-deploy' }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source/frontend/vue3/cupitor-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/frontend/vue3/cupitor-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Test language, sync and deployment
        run: |
          npx jest public/language public/github-utils.test.js --runInBand --silent
          node --test scripts/deploy-site.test.cjs scripts/cache-bust.test.cjs

      - name: Install Chromium for dialog tests
        run: npx playwright install --with-deps chromium

      - name: Test search, scrolling and dialogs on desktop and mobile
        run: |
          node tests/browser/language-dialogs.cjs
          node tests/browser/search-result-counts.cjs
          node tests/browser/compound-vocabulary-groups.cjs
          node tests/browser/regex-search.cjs
          node tests/browser/practice-manual-video.cjs
          node tests/browser/recorded-searches-scroll.cjs --huge
          node tests/browser/recorded-playlist-pages.cjs
          node tests/browser/recorded-scroll-momentum.cjs

      - name: Test complete subtitle capture merges and cache recovery
        run: node tests/browser/subtitle-completeness.cjs

      - name: Build production site
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Test built regex search, Player and Practice controls
        run: |
          node tests/browser/compound-vocabulary-groups.cjs
          node tests/browser/regex-search.cjs
          node tests/browser/recorded-searches-scroll.cjs --huge
          node tests/browser/recorded-playlist-pages.cjs
          node tests/browser/recorded-scroll-momentum.cjs
          node tests/browser/player-replay.cjs
          node tests/browser/view-switching.cjs
          node tests/browser/practice-controls.cjs
          node tests/browser/practice-manual-video.cjs
          node tests/browser/study-controls.cjs
          node tests/browser/study-chrome.cjs
          node tests/browser/unavailable-videos.cjs
          node tests/browser/player-seek.cjs
        env:
          CUPITOR_TEST_ASSETS: dist

      # A separate repo needs its own write credential. The normal
      # GITHUB_TOKEN is scoped to cupitor and cannot publish to this repo.
      - name: Check publishing credential
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/music-study-app'
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [[ -z "$PAGES_DEPLOY_TOKEN" ]]; then
            echo '::error::Add PAGES_DEPLOY_TOKEN to cupitor Actions secrets: a fine-grained token for trexsatya.github.io with Contents read/write.'
            exit 1
          fi

      - name: Check out publishing repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/music-study-app'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: trexsatya/trexsatya.github.io
          ref: gh-pages
          path: published
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          persist-credentials: true
          sparse-checkout: |
            /*
            !/db/
          sparse-checkout-cone-mode: false

      - name: Publish frontend without replacing site data
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/music-study-app'
        env:
          DEPLOY_SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/publish-site.sh "$PWD/dist" "$GITHUB_WORKSPACE/published" "$DEPLOY_SOURCE_SHA"
