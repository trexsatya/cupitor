name: Test and deploy frontend

on:
  push:
    branches: [master]
    paths:
      - frontend/vue3/cupitor-frontend/**
      - .github/workflows/deploy-site.yml
  pull_request:
    branches: [master]
    paths:
      - frontend/vue3/cupitor-frontend/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cupitor-${{ github.event_name == 'pull_request' && github.ref || 'gh-pages-deploy' }}
  # Superseded PR checks can stop; publishing jobs remain serialized.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-search:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source/frontend/vue3/cupitor-frontend
    env:
      CUPITOR_REAL_SUBTITLE_DATA: ${{ github.workspace }}/data/db/language/swedish
      CYPRESS_INSTALL_BINARY: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: trexsatya/trexsatya.github.io
          ref: gh-pages
          path: data
          sparse-checkout-cone-mode: false
          sparse-checkout: /db/language/swedish/srts/
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/frontend/vue3/cupitor-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Native WKWebView real-library search
        run: node tests/macos/subtitle-search.cjs
      - name: Build production site
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - name: Native WKWebView production search
        run: node tests/macos/subtitle-search.cjs
        env:
          CUPITOR_TEST_ASSETS: dist
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: source/frontend/vue3/cupitor-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/frontend/vue3/cupitor-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Check application syntax
        run: |
          node --check public/language/language.js
          node scripts/build-page-scripts.cjs --check

      - name: Install isolated feature test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/cupitor-feature-tests" --no-audit --no-fund jsdom@26.1.0 jquery@3.7.1 @babel/parser@7.28.5
          echo "CUPITOR_JSDOM=$RUNNER_TEMP/cupitor-feature-tests/node_modules/jsdom" >> "$GITHUB_ENV"
          echo "CUPITOR_PLAYWRIGHT=$PWD/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"

      - name: Test language, sync and deployment
        run: |
          npx jest public/language public/github-utils.test.js --runInBand --silent
          node --test public/page-scripts/*.test.mjs
          node --test scripts/deploy-site.test.cjs scripts/cache-bust.test.cjs
          node --test tests/whiteboard/composites.unit.test.cjs
          node --test public/language/data-source-loading.test.mjs
          node --test public/language/user-data*.test.mjs
          node --test public/language/subtitle-search*.test.mjs public/language/subtitle-index-store.test.mjs
          node --test public/language/word-map-library.test.mjs
          node --test public/language/spotify-*.test.mjs public/language/card-selection-search.test.mjs public/language/recordings-sync-state.test.mjs
          node --test public/language/word-map-search.test.mjs public/language/word-map-model.test.mjs public/language/word-maps.test.mjs public/language/word-maps-sync.test.mjs public/language/word-maps-github.test.mjs
          node --test public/language/study-calls.test.mjs
          node --test public/language/subtitle-bundles.test.mjs public/language/subtitle-pack-loading.test.mjs tools/language/subtitle-bundles.test.mjs tools/language/srt-import.test.mjs tools/language/bundle-repair.test.mjs
          npx jest tools/language --runInBand --silent

      - name: Install Chromium for dialog tests
        run: npx playwright install --with-deps chromium

      - name: Test search, scrolling and dialogs on desktop and mobile
        env:
          SCREENSHOT_DIR: test-results/dialog-browser-results
        run: |
          node tests/browser/page-find.cjs
          node tests/browser/card-tts.cjs
          node tests/browser/rich-card-scroll.cjs
          node tests/browser/practice-rich-card-controls.cjs
          node tests/browser/study-page-scroll.cjs
          node tests/browser/spotify-practice.cjs
          node tests/browser/notification-practice.cjs
          node tests/browser/study-calls.cjs
          node tests/browser/language-dialogs.cjs
          node tests/browser/local-file-picker.cjs
          node tests/browser/local-speakover.cjs
          node tests/browser/web-speakover.cjs
          node tests/browser/local-media-subtitles.cjs
          node tests/browser/youtube-media-subtitles.cjs
          node tests/browser/youtube-return.cjs
          node --test tests/browser/subtitle-video-height.cjs public/page-scripts/*.browser.cjs
          node tests/browser/search-result-counts.cjs
          node tests/browser/search-sources.cjs
          node tests/browser/dictionary-lookup.cjs
          node tests/browser/language-routing.cjs
          node tests/browser/word-map-search.cjs
          node tests/browser/search-playlist.cjs
          node tests/browser/card-playback.cjs
          node tests/browser/card-insertion-settings.cjs
          node tests/browser/playlist-folders.cjs
          node tests/browser/full-srt-dialog.cjs
          node tests/browser/results-scrolling.cjs
          node tests/browser/compound-vocabulary-groups.cjs
          node tests/browser/regex-search.cjs
          node tests/browser/practice-manual-video.cjs
          node tests/browser/practice-panels.cjs
          node tests/browser/rich-card-colors.cjs
          node tests/browser/rich-card-paragraph.cjs
          node tests/browser/recorded-searches-scroll.cjs --huge
          node tests/browser/recorded-playlist-pages.cjs
          node tests/browser/recorded-scroll-momentum.cjs
          (cd public && node ../tests/browser/dialog-scrolling.mjs)

      - name: Test complete subtitle capture merges and cache recovery
        run: |
          node tests/browser/user-data-storage.cjs
          node tests/browser/subtitle-worker.cjs
          node tests/browser/subtitle-busy-host.cjs
          node tests/browser/subtitle-memory.cjs
          node tests/browser/subtitle-index.cjs
          node tests/browser/subtitle-scaling.cjs
          node tests/browser/subtitle-completeness.cjs
          node tests/browser/subtitle-bundles.cjs
          node tests/browser/subtitle-pack-loading.cjs
          node tests/browser/caption-capture-merge.cjs

      - name: Build production site
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Test built regex search, Player and Practice controls
        run: |
          node tests/browser/search-sources.cjs
          node tests/browser/user-data-storage.cjs
          node tests/browser/subtitle-worker.cjs
          node tests/browser/subtitle-busy-host.cjs
          node tests/browser/subtitle-memory.cjs
          node tests/browser/subtitle-index.cjs
          node tests/browser/subtitle-scaling.cjs
          node tests/browser/compound-vocabulary-groups.cjs
          node tests/browser/regex-search.cjs
          node tests/browser/caption-capture-merge.cjs
          node tests/browser/dictionary-lookup.cjs
          node tests/browser/language-routing.cjs
          node tests/browser/word-map-search.cjs
          node tests/browser/results-scrolling.cjs
          node tests/browser/full-srt-dialog.cjs
          node tests/browser/subtitle-bundles.cjs
          node tests/browser/subtitle-pack-loading.cjs
          node tests/browser/recorded-searches-scroll.cjs --huge
          node tests/browser/recorded-playlist-pages.cjs
          node tests/browser/recorded-scroll-momentum.cjs
          node tests/browser/player-replay.cjs
          node tests/browser/card-playback.cjs
          node tests/browser/card-insertion-settings.cjs
          node tests/browser/playlist-folders.cjs
          node tests/browser/search-playlist.cjs
          node tests/browser/view-switching.cjs
          node tests/browser/spotify-practice.cjs
          node tests/browser/notification-practice.cjs
          node tests/browser/study-calls.cjs
          node tests/browser/practice-controls.cjs
          node tests/browser/practice-manual-video.cjs
          node tests/browser/practice-panels.cjs
          node tests/browser/study-controls.cjs
          node tests/browser/study-chrome.cjs
          node tests/browser/local-file-picker.cjs
          node tests/browser/local-speakover.cjs
          node tests/browser/web-speakover.cjs
          node tests/browser/local-media-subtitles.cjs
          node tests/browser/youtube-media-subtitles.cjs
          node tests/browser/youtube-return.cjs
          node tests/browser/unavailable-videos.cjs
          node tests/browser/player-seek.cjs
          (cd dist && node ../tests/browser/dialog-scrolling.mjs)
        env:
          CUPITOR_TEST_ASSETS: dist

      - name: Save dialog regression screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dialog-source-and-build-screenshots
          path: source/frontend/vue3/cupitor-frontend/test-results/dialog-browser-results/
          if-no-files-found: ignore
          retention-days: 14

      # A separate repo needs its own write credential. The normal
      # GITHUB_TOKEN is scoped to cupitor and cannot publish to this repo.
      - name: Check publishing credential
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [[ -z "$PAGES_DEPLOY_TOKEN" ]]; then
            echo '::error::Add PAGES_DEPLOY_TOKEN to cupitor Actions secrets: a fine-grained token for trexsatya.github.io with Contents read/write.'
            exit 1
          fi

      - name: Check out publishing repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: trexsatya/trexsatya.github.io
          ref: gh-pages
          path: published
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          persist-credentials: true
          sparse-checkout: |
            /*
            !/db/*
            /db/js/
            !/db/js/*
            /db/js/snippet.js
            /db/js/frame-boot.js
          sparse-checkout-cone-mode: false

      - name: Publish frontend without replacing site data
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          DEPLOY_SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/publish-site.sh "$PWD/dist" "$GITHUB_WORKSPACE/published" "$DEPLOY_SOURCE_SHA"
