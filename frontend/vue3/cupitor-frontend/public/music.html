<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Sequence Search</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/github-utils.js"></script>
    <script src="/vendor/opensheetmusicdisplay.min.js"></script>
    <script src="/vendor/tone.js"></script>
    <link rel="stylesheet" href="/music.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 1rem;
        }

        .passing {
            background: #a0d8ef; /* light blue */
            border-radius: 3px;
            padding: 0 2px;
        }

        .text-xl {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .font-bold {
            font-weight: bold;
        }

        .bg-blue-600 {
            background-color: #2563eb;
        }

        .text-white {
            color: #fff;
        }

        .px-3 {
            padding-left: .75rem;
            padding-right: .75rem;
        }

        .py-1 {
            padding-top: .25rem;
            padding-bottom: .25rem;
        }

        .rounded {
            border-radius: .5rem;
        }

        .mt-4 {
            margin-top: 1rem;
        }

        .text-green-600 {
            color: #16a34a;
        }

        .text-red-600 {
            color: #dc2626;
        }

        .font-semibold {
            font-weight: 600;
        }

        .highlight {
            background: yellow;
            border-radius: 3px;
            padding: 0 2px;
        }

        .accordion {
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .accordion summary {
            cursor: pointer;
            padding: 6px;
            font-weight: bold;
        }

        .accordion pre {
            white-space: pre-wrap;
            margin: 0;
            padding: 6px;
        }

        .controls {
            margin-bottom: 1em;
        }

        .accordion-container {
            width: 100%;
            font-family: system-ui, sans-serif;
        }

        .accordion-header {
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            background: #f3f3f3;
            border: none;
            outline: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.25s, color 0.25s;
        }

        .accordion-header:hover {
            background: #e6e6e6;
        }

        .accordion-header.active {
            background: #ccc;
            color: #222;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            background: #fafafa;
            border: 1px solid #ddd;
            border-top: none;
            padding: 0 16px;
        }

        .accordion-content.open {
            padding: 10px 16px;
            max-height: 100%; /* or adjust as needed */
        }

        #appLayout { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; }
        #searchView { flex: 1 1 320px; min-width: 280px; }
        #musicPreview { flex: 2 1 460px; min-width: 280px; }
        #results .resultRow { padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; margin: 4px 0; cursor: pointer; }
        #results .resultRow:hover { background: #f3f3f3; }
        .chordChip { display: inline-flex; gap: 4px; align-items: center; border: 1px solid #ccc; border-radius: 6px; padding: 4px 6px; margin: 2px; }
        .match-chip { margin: 0 .15em; padding: .05em .5em; font-size: .9em; border-radius: 3px; cursor: pointer; border: 1px solid #1565c0; background: #eef4ff; color: #1565c0; }
        .match-chip.on { border-color: #b8860b; background: #ffcc00; color: #4a3500; font-weight: 600; }
        .extPill { border: 1px solid #bbb; border-radius: 10px; padding: 0 8px; cursor: pointer; background: #fff; }
        .extPill.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        #managerSection { margin-bottom: 1rem; }
        #managerSection > summary { cursor: pointer; font-weight: 600; }

        /* Native fullscreen (#previewFullscreenBtn): give the pane a solid background and let it
           scroll, since the fullscreen element otherwise renders on a black, non-scrolling backdrop. */
        #musicPreview:fullscreen { background: #fff; overflow: auto; padding: 1rem; }
        #musicPreview:-webkit-full-screen { background: #fff; overflow: auto; padding: 1rem; }

        /* On phones the inline preview is too cramped; show it as a full-screen modal dialog.
           #musicPreview is toggled via display:none/block, so when shown these rules make it a
           fixed overlay. The existing Close button (#previewCloseBtn) dismisses it. */
        @media (max-width: 700px) {
          /* Floating play/pause button: only on mobile, only while a piece is open. */
          body.preview-open #fabPlay {
            display: flex; align-items: center; justify-content: center;
            position: fixed; z-index: 1200;
            right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
            width: 56px; height: 56px; border-radius: 50%;
            background: #1565c0; color: #fff; border: none;
            font-size: 24px; line-height: 1; cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,.35);
          }
          #musicPreview {
            position: fixed;
            /* Explicit longhand offsets + sizes, NOT the `inset` shorthand: older mobile Safari
               ignores `inset`, leaving the fixed box to size to its content (taller/wider than the
               screen) while the body is locked — so nothing scrolls and the score is clipped. */
            top: 0; right: 0; bottom: 0; left: 0;
            width: 100%;
            height: 100vh;
            height: 96%;          /* dynamic viewport: excludes the mobile browser's URL bar */
            box-sizing: border-box;  /* keep the 1rem padding inside the viewport box (no overflow) */
            z-index: 1000;
            margin: 0;
            background: #fff;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
            border-top: none;
            box-shadow: 0 0 24px rgba(0, 0, 0, .4);
          }
          /* The score can be wider than the screen; let it scroll horizontally on its own so the
             page body never has to. */
          #osmdPreview { overflow-x: auto; }
          /* Keep the close/segment controls reachable at the top while scrolling the score. */
          #musicPreview > div:first-child {
            position: sticky;
            top: 0;
            background: #fff;
            padding-bottom: .4rem;
            z-index: 1;
          }
          body.preview-open { overflow: hidden; }   /* lock the page behind the dialog */
        }
        #fretboardPanel.fb-wrap{background:#fff;border:1px solid #d8dee8;border-radius:10px;padding:10px 14px;margin-top:1rem}
        #fretboardPanel summary{cursor:pointer;font-weight:600}
        /* Nested "Controls" collapsible: subtler than the panel's own summary. */
        #fretboardPanel .fb-controls{margin:6px 0}
        #fretboardPanel .fb-controls>summary{font-weight:500;font-size:12.5px;color:#555;list-style:none}
        #fretboardPanel .fb-controls>summary::-webkit-details-marker{display:none}
        #fretboardPanel .fb-controls>summary::before{content:'▸ ';color:#888}
        #fretboardPanel .fb-controls[open]>summary::before{content:'▾ '}
        #fretboardPanel .fb-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;margin:8px 0}
        #fretboardPanel .fb-chip{border:1px solid #1565c0;color:#1565c0;border-radius:999px;padding:2px 10px;cursor:pointer;background:#eef4ff}
        #fretboardPanel .fb-chip.alt{border-color:#bbb;color:#555;background:#fff}
        #fretboardPanel .fb-btn{border:1px solid #1565c0;border-radius:6px;padding:3px 12px;cursor:pointer}
        #fretboardPanel .fb-paths{margin:8px 0;font-size:13px}
        #fretboardPanel .fb-paths select{font:12.5px monospace;padding:4px 8px;border:1px solid #1565c0;border-radius:6px;min-width:320px}
        #fretboardPanel .fb-step{display:flex;gap:8px;align-items:center;font-size:13px;margin:8px 0;flex-wrap:wrap}
        #fretboardPanel .fb-msg{color:#c62828;font-size:12px}
        /* Keep Prev / Step / Next together on one line even when the row wraps. */
        #fretboardPanel .fb-nav{display:inline-flex;gap:8px;align-items:center;flex-wrap:nowrap}
        #fretboardPanel .fb-step-lbl{white-space:nowrap}
        /* Movement arrows: dashes march toward the arrowhead (up = right, down = left); the
           bidirectional arrow pulses instead. Arrowheads pulse for visibility. */
        #fretboardPanel .fb-arrow-line{stroke-dasharray:6 4}
        #fretboardPanel .fb-arrow-line.up{animation:fbFlowFwd .7s linear infinite}
        #fretboardPanel .fb-arrow-line.down{animation:fbFlowBack .7s linear infinite}
        #fretboardPanel .fb-arrow-line.bi{stroke-dasharray:none;animation:fbArrowPulse 1.1s ease-in-out infinite}
        #fretboardPanel .fb-arrowhead{animation:fbArrowPulse 1.1s ease-in-out infinite}
        @keyframes fbFlowFwd{to{stroke-dashoffset:-10}}
        @keyframes fbFlowBack{to{stroke-dashoffset:10}}
        @keyframes fbArrowPulse{0%,100%{opacity:.35}50%{opacity:1}}
        @media (prefers-reduced-motion: reduce){
          #fretboardPanel .fb-arrow-line,#fretboardPanel .fb-arrowhead{animation:none}
        }
        #fbSvg{max-width:100%;overflow-x:auto;display:block}
        /* Collapsible Motifs / Phrases panels (like the fretboard panel) + shared match bar. */
        .np-panel{margin:.25rem 0;padding:.4rem .6rem;border-radius:4px}
        .np-panel>summary{cursor:pointer;font-weight:600;font-size:13.5px}
        /* Header toggle: shows/hides THIS panel's tags/phrases on the sheet (dim the rest), independent
           of expand/collapse (which only shows the panel's own controls + list). */
        .np-vis{margin-left:8px;border:1px solid #bbb;background:#fff;border-radius:6px;padding:1px 7px;cursor:pointer;font-size:12.5px;font-weight:400;vertical-align:middle}
        .np-vis[aria-pressed="true"]{background:#1565c0;border-color:#1565c0;color:#fff}
        #tagPanel{background:#f6f3ff;border:1px solid #ddd0ff}
        #phrasePanel{background:#eef4ff;border:1px solid #cfe0ff}
        /* When expanded, a panel's body floats over the sheet (absolute) instead of pushing it down —
           so toggling a panel never reflows the page (which could nudge a scrollbar and force OSMD to
           re-render, dropping the pattern-match highlights). Anchored below both summaries via .np-wrap. */
        .np-wrap{position:relative}
        .np-panel[open]>.np-body{position:absolute;left:0;right:0;top:100%;z-index:60;margin-top:3px;
          border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:.5rem .7rem;max-height:72vh;overflow:auto}
        #tagPanel[open]>.np-body{background:#f6f3ff;border:1px solid #ddd0ff}
        #phrasePanel[open]>.np-body{background:#eef4ff;border:1px solid #cfe0ff}
        .pattern-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin:.25rem 0;padding:.35rem .6rem;background:#fafafa;border:1px solid #e5e5e5;border-radius:4px}
        .pattern-controls select{padding:3px 6px;border:1px solid #ccc;border-radius:5px;font-size:13px}
        /* Pattern tags */
        #tagPanel .tag-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
        #tagPanel .tag-lbl{color:#555}
        #tagPanel select,#tagPanel #tagNew{padding:3px 6px;border:1px solid #c9b8ff;border-radius:5px;font-size:13px}
        #tagPanel .tag-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
        #tagPanel .tag-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #ddd0ff;border-radius:999px;padding:3px 8px;font-size:12.5px;background:#fff}
        #tagPanel .tag-pill .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
        #tagPanel .tag-pill .cnt{color:#888}
        #tagPanel .tag-pill .del{border:none;background:none;color:#a33;cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
        /* Check/uncheck-all sits just before the tag pills. */
        #tagPanel .tag-list-head{display:flex;align-items:flex-start;gap:8px;margin-top:8px}
        #tagPanel .tag-list-head .tag-list{margin-top:0}
        #tagPanel .icon-btn{border:1px solid #bbb;background:#fff;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:15px;line-height:1.5;flex:none}
        /* Phrases panel: one card per phrase (header row of actions + a wrap of member-tag checkboxes). */
        #phrasePanel .tag-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
        #phrasePanel .tag-lbl{color:#555}
        #phrasePanel .tag-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
        #phrasePanel .phrase-row{border:1px solid #cfe0ff;border-radius:6px;padding:6px 8px;background:#fff}
        #phrasePanel .phrase-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
        #phrasePanel .phrase-tags{display:flex;flex-wrap:wrap;margin-top:6px;padding-top:6px;border-top:1px dashed #e0e8f5}
        #phrasePanel .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
        #phrasePanel .del{border:none;background:none;color:#a33;cursor:pointer;font-size:15px;line-height:1;padding:0 2px;margin-left:auto}
        #phrasePanel .btn.active{background:#1565c0;color:#fff;border-color:#1565c0}
        /* Variations panel — decorate a voice over a ≤3-measure segment with non-chord-tone techniques.
           Normal-flow (not the floating .np-body overlay) because it hosts its own render sheet. */
        #variationsSection{background:#f2fbf4;border:1px solid #c6e9cf}
        #variationsSection>summary{color:#1b7f3b}
        #variationsSection .var-body{margin-top:.5rem;display:flex;flex-direction:column;gap:.5rem}
        #variationsSection .var-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
        #variationsSection .var-controls select{padding:3px 6px;border:1px solid #b5ddc0;border-radius:5px;font-size:13px}
        #variationsSection .var-techs{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:#333}
        #variationsSection .var-techs label{display:inline-flex;gap:4px;align-items:center}
        #variationsSection #varGenerate{background:#1b7f3b;color:#fff;border-color:#1b7f3b}
        #variationsSection #varGenerate:disabled{background:#cfe6d6;border-color:#cfe6d6;color:#6d8a76;cursor:not-allowed}
        #variationsSection .var-warn{font-size:12px;color:#b42318}
        #variationsSection .var-picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:.25rem 0}
        #variationsSection #varSelect{flex:1;min-width:160px;padding:4px 6px;border:1px solid #b5ddc0;border-radius:5px;font-size:13px;background:#fff}
        #variationsSection #varPlay,#variationsSection #varFret,#variationsSection #varSilence,#variationsSection #varHearAll,#variationsSection #varSaveVocab{border:1px solid #1b7f3b;background:#fff;color:#1b7f3b;border-radius:5px;cursor:pointer;padding:3px 10px;font-size:13px}
        #variationsSection #varSelect:disabled,#variationsSection #varPlay:disabled,#variationsSection #varFret:disabled,#variationsSection #varSilence:disabled,#variationsSection #varHearAll:disabled,#variationsSection #varSaveVocab:disabled{opacity:.5;cursor:not-allowed}
        #variationsSection #varSilence.active,#variationsSection #varHearAll.active{background:#1b7f3b;color:#fff}
        #variationsSection .var-silence-hint{font-size:12px;color:#a0660a}
        #variationsSection .var-empty{font-size:12.5px;color:#777}
        #variationsSection #varSheet{margin-top:.25rem;overflow-x:auto}
        #fretboardPanel:fullscreen{background:#fff;overflow:auto;padding:24px}
        #fretboardPanel:fullscreen #fbSvg{width:100%;height:auto;max-width:none}
        /* Touch-friendly chord-window move/resize buttons (alternative to dragging) */
        #windowNudge.win-nudge{display:inline-flex;gap:6px;align-items:center;margin-right:.5em;vertical-align:middle}
        #windowNudge .win-btn{min-width:40px;height:36px;border:1px solid #1565c0;background:#eef4ff;color:#1565c0;border-radius:6px;font-size:16px;line-height:1;cursor:pointer;font-weight:700}
        #windowNudge .win-btn:active{background:#1565c0;color:#fff}
        #windowNudge .win-sep{display:inline-block;width:1px;height:22px;background:#cfe0ff}
        /* Fretboard panel — mobile layout: bigger touch targets, full-width select, stacked controls */
        @media (max-width:640px){
          #fretboardPanel.fb-wrap{padding:8px 10px}
          /* Smaller, tidier tap targets (the old 40px min-height looked clunky). */
          #fretboardPanel .fb-btn,#fretboardPanel .fb-chip{padding:4px 9px;font-size:12px}
          #fretboardPanel .fb-bar .fb-btn{margin-left:0 !important}
          #fretboardPanel .fb-paths select{width:100%;min-width:0}
          #fretboardPanel .fb-bar,#fretboardPanel .fb-step{gap:6px}
          #fbSpeed{flex:1 1 120px}
          #windowNudge .win-btn{min-width:48px;height:42px;font-size:18px}
        }
        /* Practice log */
        #practiceSection{margin:.5rem 0;border:1px solid #e3dcff;border-radius:8px;padding:.35rem .6rem;background:#faf8ff}
        #practiceSection > summary{cursor:pointer;font-weight:600}
        .pl-form{margin:.5rem 0;display:flex;flex-direction:column;gap:8px}
        .pl-form .pl-row{display:flex;gap:12px;flex-wrap:wrap}
        .pl-form label{display:flex;flex-direction:column;font-size:12px;color:#555;gap:2px}
        .pl-form .pl-wide{width:100%}
        .pl-form input[type=text],.pl-form textarea,.pl-form input[type=date],.pl-form select,
        .pl-addfield input,.pl-addfield select{padding:4px 6px;border:1px solid #c9b8ff;border-radius:5px;font-size:13px}
        .pl-form .pl-wide input,.pl-form textarea{width:100%}
        .pl-fields{border:1px dashed #d8ccff;border-radius:6px;padding:6px 8px}
        .pl-fields-head{font-size:11.5px;color:#777;margin-bottom:4px}
        .pl-addfield{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
        .pl-field-row{display:flex;gap:6px;align-items:center;margin:3px 0;font-size:13px}
        .pl-field-row .pl-fname{font-weight:600;min-width:8em}
        .pl-field-row .pl-fval{flex:1}
        .pl-field-row .pl-fx{border:none;background:none;color:#a33;cursor:pointer;font-size:15px}
        .pl-form-foot{display:flex;gap:8px;align-items:center}
        .pl-form-foot #plSave{background:#1565c0;color:#fff;border-color:#1565c0}
        #practiceList{display:flex;flex-direction:column;gap:8px;margin-top:6px}
        .pl-entry{border:1px solid #e6e0f7;border-radius:8px;padding:8px 10px;background:#fff}
        .pl-entry-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .pl-entry-week{font-weight:700;font-size:13px}
        .pl-entry-goal{flex:1;min-width:8em}
        .pl-piece-link{color:#1565c0;cursor:pointer;text-decoration:underline;font-size:12.5px}
        .pl-entry-notes{color:#444;font-size:12.5px;margin-top:4px;white-space:pre-wrap}
        .pl-entry-fields{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
        .pl-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #e0e0e0;border-radius:999px;padding:1px 8px;font-size:12px;background:#fafafa}
        .pl-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
        .pl-status-badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;color:#fff}
        .pl-entry .icon-btn{border:1px solid #bbb;background:#fff;border-radius:6px;padding:1px 7px;cursor:pointer;font-size:13px}
        /* Mobile floating play/pause button */
        #fabPlay{display:none}
        /* Guessed-key badge in the piece list */
        .key-badge{display:inline-block;background:#fff3cd;color:#7a5b00;border:1px solid #ffe08a;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;vertical-align:baseline}
        /* Split-collection confirm dialog */
        .split-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000}
        .split-box{background:#fff;color:#222;border-radius:10px;max-width:560px;width:92%;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3);padding:16px 18px}
        .split-head{font-weight:700;font-size:16px;margin-bottom:2px}
        .split-sub{color:#666;font-size:12.5px;margin-bottom:10px}
        .split-prefix{margin-bottom:10px}
        .split-prefix label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#555}
        .split-prefix input{flex:1;padding:6px 8px;border:1px solid #c9b8ff;border-radius:6px;font-size:13px}
        .split-list{overflow:auto;border:1px solid #eee;border-radius:8px;padding:4px}
        .split-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #f2f2f2}
        .split-row:last-child{border-bottom:none}
        .split-title{flex:1;font-size:13.5px}
        .split-meta{color:#999;font-size:11.5px;white-space:nowrap}
        .split-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
        .split-foot button{padding:6px 14px;border-radius:6px;border:1px solid #ccc;background:#f7f7f7;cursor:pointer}
        .split-foot .split-add{background:#1565c0;color:#fff;border-color:#1565c0;font-weight:600}
        .split-foot .split-add:disabled{opacity:.5;cursor:default}
    </style>
</head>
<body>
<h2 style="margin:.25rem 0">Music study — <span id="systemLabel"></span></h2>
<details id="managerSection">
  <summary>Manage library (add / rebuild / push pieces)</summary>
  <div class="controls">
    <button id="addXmlBtn">Add MusicXML…</button>
    <input type="file" id="xmlFile" accept=".xml,.musicxml,application/xml,text/xml" style="display:none" multiple>
    <button id="addTextBtn">Add note-text…</button>
    <button id="rebuildBtn">Rebuild selected/new (local)</button>
    <button id="retryBtn" style="display:none"></button>
    <span id="status"></span>
  </div>
  <textarea id="textInput" placeholder="Paste note-text, first line = title" style="display:none;width:100%;height:6em"></textarea>
  <div id="tagFilterBar" style="margin:.35rem 0"></div>
  <div id="keyFilterBar" style="margin:.35rem 0"></div>
  <div id="pieceList"></div>
</details>
<details id="practiceSection">
  <summary>🗓️ Practice Log</summary>
  <div class="pl-form">
    <div class="pl-row">
      <label>Week <input type="date" id="plWeek"></label>
      <label>Piece
        <select id="plPiece"><option value="">— none —</option></select>
      </label>
      <label>Status <select id="plStatus"></select></label>
    </div>
    <label class="pl-wide">Goal <input type="text" id="plGoal" placeholder="This week's goal…"></label>
    <label class="pl-wide">Notes <textarea id="plNotes" rows="2" placeholder="Notes…"></textarea></label>
    <div class="pl-fields">
      <div class="pl-fields-head">Custom fields</div>
      <div id="plFieldRows"></div>

<script type="module">
  import { getSystemFromUrl, getMusicResourceUrl, loadLibrary, computeChanges, pushPending, filterByTags, removePieceFromLibrary } from './music-index.js';
  import { splitMusicXmlPieces, defaultTitlePrefix, pieceTitle } from './music-split.js';
  import { runQuery } from './music-query.js';
  import { createMusicRenderer, resolveMatchMeasures, collapsedChordSpans } from './music-render.js';
  import { init as initFretboard } from './fretboard-panel.js';
  import { chordDisplayName } from './music-chords.js';
  import { buildChordQuery, buildMelodyQuery, matchSummary } from './music-search-ui.js';
  import { createMusicStore } from './music-local-store.js';
  import { PRACTICE_STATUSES, statusMeta, weekStart, weekLabel, makeEntry, upsertEntry, removeEntry, sortEntries, mergeFieldName } from './music-practice.js';
  import { buildSchedule, buildScheduleFromMusicXml, createMusicPlayer, createYouTubeController, parseYouTubeId, instrumentVoiceKey } from './music-player.js';
  import { guessSegmentStart, linkYouTubeLocal } from './music-media.js';
  import { buildSnapshot, buildVocabEntry, upsertVocab, uniqueVocabId, loadVocab, groupVocabByCategory } from './music-vocab.js';
  import { addTag as addTagReg, removeTag as removeTagReg, mergeRegistry } from './music-tags.js';
  import { TECHNIQUES, generateVariations } from './music-embellish.js';
  import { generateCounterLines } from './music-counterpoint.js';
  import { extractSegmentXml, applyVariation, coloredNoteMarks, ADDED_NOTE_COLOR, writeVoice } from './music-embellish-xml.js';
  import { buildChordByMeasure, buildVoiceNotes, orderedVoiceIds, addressableMidis, variationFretSteps, voicePickerEntries, counterLineToNotesByMeasure, buildBeatNotes, distinctVoiceIdsInOrder } from './music-embellish-ui.js';
  import { splitSingleVoice } from './music-voice-split.js';
  import { encodeMusicXml } from './music-encoding.js';

  const system = getSystemFromUrl().name;
  document.getElementById('systemLabel').textContent = system;

  // jQuery is already global in music.html (loaded via <script>); musicxml.js needs it.
  let index = [];
  let unpushedIds = new Set();   // pieces with local index/detail edits (add/rebuild/tags/link) awaiting push
  let vocab = [];
  let dirtyVocab = false;        // vocab.json changed locally, awaiting the manual push
  let dirtyIndex = false;        // index.json changed with no unpushed piece (e.g. a delete) — needs push
  const tagFilter = new Set();   // active tag filter; applies to the library list AND search
  let keyFilter = '';            // active guessed-key filter ('' = all); applies to the library list
  let practiceEntries = [];      // weekly practice log entries (local-only)
  let practiceFields = [];       // global custom-field-name registry (grows as you name new fields)
  let practiceDraft = [];        // custom fields being composed in the form: [{name,value,status}]
  let practiceEditId = null;     // id of the entry currently loaded into the form (null = new)
  const store = createMusicStore();
  const pending = [];  // newly added pieces not yet pushed: {id,title,format,source,key}

  // Pattern-tag registry: the GLOBAL list of tags [{name,color}], shared across all pieces and
  // synced via a pushed tags.json (like vocab.json). Per-piece note assignments live in each
  // detail.patterns. Loaded at startup; edits persist locally and go out in the next manual push.
  let tagRegistry = [];
  let dirtyTags = false;   // tags.json changed locally, awaiting the manual push
  async function loadTagRegistry() {
    let remote = [];
    try { const res = await fetch(`${getMusicResourceUrl(system)}/tags.json`); if (res.ok) remote = await res.json(); } catch (_) { remote = []; }
    let local = [];
    try { local = (await store.getTags(system)) || []; } catch (_) { local = []; }
    return mergeRegistry(remote, local);   // remote ∪ local-only tags, colors preserved
  }
  function saveTagRegistry() {
    store.putTags(system, tagRegistry).catch(() => {});
    dirtyTags = true;
    if (renderer) renderer.setTagRegistry(tagRegistry);
    updatePushBtn();
  }

  function idFromName(name) {
    return name.replace(/\.(xml|musicxml|txt)$/i, '').trim().replace(/\s+/g, '_').replace(/[\/\\:*?"<>|]/g, '');
  }
  function setStatus(s) { document.getElementById('status').textContent = s; }

  // The single manual-push affordance: every edit stacks up locally; this button (was "Retry push")
  // commits them all in one batch. Count = unpushed pieces + a vocab change + an index-only change.
  function updatePushBtn() {
    const btn = document.getElementById('retryBtn');
    const n = unpushedIds.size + (dirtyVocab ? 1 : 0) + (dirtyIndex ? 1 : 0) + (dirtyTags ? 1 : 0);
    if (n > 0) { btn.style.display = ''; btn.textContent = `Push changes (${n})`; }
    else { btn.style.display = 'none'; }
  }
  function hasPending() { return unpushedIds.size > 0 || dirtyVocab || dirtyIndex || dirtyTags; }

  function makeCommitter(label) {
    return (files) => window.GitHubUtils.commitMultipleFiles({
      owner: 'trexsatya', repo: 'trexsatya.github.io', branch: 'gh-pages',
      commitMessage: `music(${system}): rebuild ${label}`, files
    });
  }

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
  // Parse a comma-separated tag string → trimmed, de-duped, non-empty list (order preserved).
  function parseTags(str) {
    const out = [];
    String(str || '').split(',').forEach(t => { const v = t.trim(); if (v && !out.includes(v)) out.push(v); });
    return out;
  }
  function allTags() {
    const set = new Set();

    const rows = [];

      + `${e.guessedKey ? `<span class="key-badge" title="Guessed key (tonal center)">${esc(e.guessedKey)}</span> ` : ''}`
      + `<button class="previewBtn" data-id="${e.id}">Preview</button> `
      + `<input class="pieceTags" data-id="${e.id}" value="${esc((e.tags || []).join(', '))}" placeholder="tags…" style="width:10em;font-size:.85em"> `

  document.getElementById('addXmlBtn').onclick = () => document.getElementById('xmlFile').click();

  document.getElementById('rebuildBtn').onclick = async () => {

      .filter(e => selectedIds.has(e.id))
      .map(e => ({ id: e.id, title: e.title, format: e.format, source: null, key: e.key }));
    // For already-indexed pieces we need their source; prefer the local store, else fetch the detail file.
    for (const r of reselected) {

  let renderer = null;

  function ensureRenderer() {

        // Sound the current step as it reads on the sheet (chords stack, melody plays in sequence),

        playSequence: (events) => {

  // ── Chord window (draggable selection over the staff) ──────────────────────────────────────

  // Auto-update chord picks while a saved vocab item is on screen. Writes the LOCAL cache only

  function syncVocabChords(names) {
    if (!currentVocabEntry) return;

    vocab = upsertVocab(vocab, currentVocabEntry);

  let player = null, yt = null, currentDetail = null, currentVocabEntry = null;
  let fbStepInstr = null;   // last instrument pushed to the player for fretboard step-play (avoids re-creating the voice)
  let fbPanel = null;       // fretboard panel controller (from initFretboard) — for cross-panel actions
  // The "Add to vocab" button doubles as "Add/update" while a saved vocab item is on screen.
  function updateAddVocabLabel() {
    const btn = document.getElementById('addVocabBtn');
    if (btn) btn.innerHTML = currentVocabEntry
      ? '<span class="ic">✎</span><span class="txt">Add/update to vocab</span>'
      : '<span class="ic">➕</span><span class="txt">Add to vocab</span>';
  }
  const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Toast notifications for media/vocab actions: stacked, auto-dismissing popups that float over the
  // page (replacing the old inline status pill). Tone sets the colour; errors linger longer; a toast
  // also dismisses on click. setMediaMsg keeps its (text, tone) signature so all call sites are unchanged.
  function toastHost() {
    let c = document.getElementById('toastHost');
    if (!c) {
      c = document.createElement('div');
      c.id = 'toastHost';
      // longhand positioning (not `inset`) for older mobile Safari; container ignores pointer events
      // so it never blocks the page, while each toast re-enables them to be click-dismissable.
      c.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:11000;'
        + 'display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw';
      document.body.appendChild(c);
    }
    return c;
  }
  function setMediaMsg(text, tone) {
    if (!text) return;
    const palette = { info: ['#eef2ff', '#3730a3', '#c7d2fe'], ok: ['#e7f6ec', '#1b7f3b', '#a7e3bd'], err: ['#fdecec', '#b42318', '#f3b4ad'] };
    const [bg, fg, border] = palette[tone] || palette.info;
    const t = document.createElement('div');
    t.textContent = text;
    t.style.cssText = `pointer-events:auto;cursor:pointer;background:${bg};color:${fg};border:1px solid ${border};`
      + 'padding:8px 14px;border-radius:10px;font-size:.9rem;line-height:1.35;box-shadow:0 4px 16px rgba(0,0,0,.18);'
      + 'max-width:92vw;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s';
    toastHost().appendChild(t);
    requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translateY(0)'; });
    let gone = false;
    const dismiss = () => { if (gone) return; gone = true; t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 280); };
    t.addEventListener('click', dismiss);
    setTimeout(dismiss, tone === 'err' ? 8000 : 4000);   // errors linger longer
  }
  function ensurePlayer() {
    if (!player) player = createMusicPlayer({ getCursor: () => (renderer && renderer.osmd ? renderer.osmd.cursor : null) });
    return player;
  }
  function segmentRange() {
    // Fields hold PRINTED numbers; convert to the sequential numbers used internally / by OSMD.
    const from = parseInt(document.getElementById('segFrom').value, 10);
    const to = parseInt(document.getElementById('segTo').value, 10);
    return (Number.isFinite(from) && Number.isFinite(to)) ? { fromMeasure: toSeqMeasure(from), toMeasure: toSeqMeasure(to) } : {};
  }
  // What to play: when the chord window is on, play only the window — note-accurate (fromBeat/
  // toBeat) when onsets are available, else the measures it spans. Otherwise the segment from/to.
  // Read live from the renderer so it can't go stale against the window's current position.
  function activeRange() {
    const winOn = document.getElementById('chordWindowChk') && document.getElementById('chordWindowChk').checked;
    const wr = winOn && renderer && renderer.getWindowRange && renderer.getWindowRange();
    if (wr) return wr;
    return segmentRange();
  }
  function currentTempo() {
    const t = parseInt(document.getElementById('tempoInput').value, 10);
    return Number.isFinite(t) && t > 0 ? t : 90;
  }
  function playMidi() {
    stopVarPlayback();   // never overlap the variation preview on the shared Tone.Transport
    if (!currentDetail) return;
    // MusicXML pieces get a time-accurate, polyphonic schedule from the source; note-text
    // pieces (no real timing) fall back to the simple per-note sequential builder.
    const useXml = currentDetail.format === 'musicxml' && currentDetail.source;
    const range = activeRange();
    const muted = (renderer && renderer.getMutedNotes) ? renderer.getMutedNotes() : [];
    const schedule = useXml
      ? buildScheduleFromMusicXml(currentDetail.source, { tempo: currentTempo(), ...range, mutedNotes: muted })
      : buildSchedule(currentDetail.voices, { tempo: currentTempo(), ...range });
    if (!schedule.length) { document.getElementById('transportMsg').textContent = 'Nothing to play.'; return; }
    const span = (range.fromBeat != null) ? ' (window)'
      : (range.fromMeasure != null) ? ` (m. ${toPrintedMeasure(range.fromMeasure)}–${toPrintedMeasure(range.toMeasure)})` : '';
    const p = ensurePlayer();
    p.setInstrument(document.getElementById('instrSel').value);
    p.setSchedule(schedule, { cursorStartStep: range.cursorStep || 0 });
    p.setLoop(document.getElementById('loopChk').checked);
    document.getElementById('transportMsg').textContent = 'Loading instrument…';
    p.play()
      .then(() => { document.getElementById('transportMsg').textContent = `Playing ${schedule.length} notes${span}`; })
      .catch(() => { document.getElementById('transportMsg').textContent = 'Playback error.'; });
  }
  // Tag skip-playback: play only the checked tags' notes, removing the empty stretches between
  // tagged runs (a beat-relative breath separates runs). Whole piece — ignores segment/window.
  function playTags() {
    stopVarPlayback();   // never overlap the variation preview on the shared Tone.Transport
    if (!currentDetail) return;
    if (!(currentDetail.format === 'musicxml' && currentDetail.source)) {
      document.getElementById('transportMsg').textContent = 'Tag playback needs a MusicXML piece.'; return;
    }
    const tagged = (renderer && renderer.getFilterNotes) ? renderer.getFilterNotes() : [];
    // Include the notes matched by the most recent Find-pattern search (if any), so the recurring
    // pattern is sounded alongside the tagged notes. Union, de-duped by (midi, beats), onset-sorted.
    const matched = (renderer && renderer.getPatternMatchNotes) ? renderer.getPatternMatchNotes() : [];
    const seen = new Set();
    const keep = [...tagged, ...matched].filter((n) => {
      const k = `${n.midi}@${n.beats}`;
      if (seen.has(k)) return false;
      seen.add(k); return true;
    }).sort((a, b) => a.beats - b.beats);
    if (!keep.length) { document.getElementById('transportMsg').textContent = 'Check a tag to play it.'; return; }
    const breath = parseFloat(document.getElementById('breathBeats').value);
    const breathBeats = (Number.isFinite(breath) && breath >= 0) ? breath : 1;
    const schedule = buildScheduleFromMusicXml(currentDetail.source, { tempo: currentTempo(), keepNotes: keep, breathBeats });
    if (!schedule.length) { document.getElementById('transportMsg').textContent = 'Nothing to play.'; return; }
    const p = ensurePlayer();
    p.setInstrument(document.getElementById('instrSel').value);
    p.setSchedule(schedule, { cursorStartStep: 0 });
    p.setLoop(document.getElementById('loopChk').checked);
    document.getElementById('transportMsg').textContent = 'Loading instrument…';
    const withMatches = matched.length ? ' (tags + matches)' : '';
    p.play()
      .then(() => { document.getElementById('transportMsg').textContent = `Playing ${schedule.length} notes${withMatches}`; })
      .catch(() => { document.getElementById('transportMsg').textContent = 'Playback error.'; });
  }
  let ytMonitor = null;
  let ytLoadedId = null;   // video id currently loaded in the player (avoid reloading on replay)
  function clearYtMonitor() { if (ytMonitor) { clearInterval(ytMonitor); ytMonitor = null; } }
  // Bound YouTube playback to [startSec, endSec]: poll currentTime and, on reaching the end,
  // loop back to the start (when Loop is checked) or pause. No-op if the range is degenerate.
  function startYtMonitor(startSec, endSec) {
    clearYtMonitor();
    if (!(endSec > startSec)) return;
    ytMonitor = setInterval(() => {
      if (!yt || !yt.isReady()) return;
      if (yt.getCurrentTime() >= endSec) {
        if (document.getElementById('loopChk').checked) yt.seekTo(startSec);
        else { yt.pause(); clearYtMonitor(); }
      }
    }, 200);
  }
  function playYouTube() {
    const url = currentDetail && currentDetail.meta && currentDetail.meta.youtube;
    const id = parseYouTubeId(url);
    if (!id) { document.getElementById('transportMsg').textContent = 'No linked YouTube video.'; return; }
    document.getElementById('ytPlayer').style.display = '';
    const range = segmentRange();
    const hasSeg = Number.isFinite(range.fromMeasure) && Number.isFinite(range.toMeasure);
    const from = range.fromMeasure || 1, to = range.toMeasure || from;
    const editedStart = parseFloat(document.getElementById('guessSec').value);
    const editedEnd = parseFloat(document.getElementById('guessEndSec').value);
    const startFor = () => {
      if (Number.isFinite(editedStart)) return editedStart;
      const g = guessSegmentStart(currentDetail, [from, to], yt.getDuration());
      document.getElementById('guessSec').value = g.toFixed(1);
      return g;
    };
    const endFor = () => {
      if (Number.isFinite(editedEnd)) return editedEnd;
      const g = guessSegmentStart(currentDetail, [to + 1, to + 1], yt.getDuration());
      document.getElementById('guessEndSec').value = g.toFixed(1);
      return g;
    };
    const begin = () => {
      const s = startFor(); yt.seekTo(s); yt.play();
      if (hasSeg) startYtMonitor(s, endFor()); else clearYtMonitor();
    };
    try {
      if (!yt) {
        // First ever play: build the player; seek+play once it's ready.
        yt = createYouTubeController('ytPlayer', { onReady: () => begin() });
        ytLoadedId = id;
        yt.load(id, Number.isFinite(editedStart) ? editedStart : 0);
      } else if (ytLoadedId !== id) {
        // Switched to a different video: reload it, then seek+play.
        ytLoadedId = id;
        yt.load(id, Number.isFinite(editedStart) ? editedStart : 0);
        begin();
      } else {
        // Same video already loaded: just seek to the segment start + play (no reload —
        // reloading mid-play raced with the immediate seek and restarted from 0).
        begin();
      }
      document.getElementById('transportMsg').textContent = 'Playing YouTube' + (hasSeg ? ' (segment)' : '');
    } catch (e) { document.getElementById('transportMsg').textContent = 'YouTube error: ' + e.message; }
  }
  document.getElementById('instrSel').onchange = () => { if (player) player.setInstrument(document.getElementById('instrSel').value); };
  // The YouTube link field stays hidden until asked for — most of the time you're not editing it.
  document.getElementById('ytToggleBtn').onclick = () => {

  };
  // View toggles (Loop, Color voices, Note names, Show chords, Dim, Chord window) are icon

  function syncToggle(btn) {
    const chk = document.getElementById(btn.dataset.for);

  function syncToggles() { document.querySelectorAll('.btn.toggle').forEach(syncToggle); }
  document.querySelectorAll('.btn.toggle').forEach((btn) => {
    btn.onclick = () => {

  function adjustSegment(which, delta) {
    if (!renderer) return;
