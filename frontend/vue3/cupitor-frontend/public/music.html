  // Populate the voice picker from the loaded piece (Voice 1..N, index-based). Called on preview load.
  function populateVarVoices() {
    const sel = document.getElementById('varVoice');
    if (!sel) return;
    sel.innerHTML = '';
    // orderedVoiceIds matches the encoder's voicesMap key order, so varVoiceIds[i] ↔ voices[i].
    varVoiceIds = (currentDetail && currentDetail.source) ? orderedVoiceIds(currentDetail.source) : ['1'];
    // Entries drive the picker: multi-voice → one per real voice; single-voice → Melody/Bass (auto-split).
    varEntries = (currentDetail && currentDetail.source)
      ? voicePickerEntries(currentDetail.source, varVoiceIds)
      : [];
    varEntries.forEach((entry, i) => {
      const opt = document.createElement('option');
      opt.value = String(i); opt.textContent = entry.label;
      sel.appendChild(opt);
    });
  }

  // Sequential segment span from the printed fields.
  function varSegRange() {
    const from = toSeqMeasure(parseInt(document.getElementById('segFrom').value, 10));
    const to = toSeqMeasure(parseInt(document.getElementById('segTo').value, 10));
    return { from, to };
  }

  // Guardrail: only allow generating for a ≤3-measure segment.
  function refreshVariationsGuardrail() {
    const btn = document.getElementById('varGenerate');
    const warn = document.getElementById('varWarn');
    if (!btn || !warn) return;
    const { from, to } = varSegRange();
    const span = (Number.isFinite(from) && Number.isFinite(to)) ? (to - from + 1) : 0;
    if (span > 3) {
      btn.disabled = true;
      warn.textContent = 'Narrow the segment to 3 measures or fewer.';
    } else {
      btn.disabled = false;
      warn.textContent = '';
    }
  }
  document.getElementById('segFrom').addEventListener('input', refreshVariationsGuardrail);
  document.getElementById('segTo').addEventListener('input', refreshVariationsGuardrail);
  document.getElementById('variationsSection').addEventListener('toggle', (e) => { if (e.target.open) refreshVariationsGuardrail(); });

  // Style selector drives which extra controls are relevant: contrapuntal hides the technique
  // checkboxes and reveals the Counter register; bluesy reveals Shuffle. (#varTechs is the checkbox
  // container div, so hiding it hides every technique checkbox at once.)
  document.getElementById('varStyle').addEventListener('change', (e) => {
    const style = e.target.value;
    const techs = document.getElementById('varTechs');
    if (techs) techs.style.display = style === 'contrapuntal' ? 'none' : '';
    document.getElementById('varShuffleWrap').style.display = style === 'bluesy' ? '' : 'none';
    document.getElementById('varRegisterWrap').style.display = style === 'contrapuntal' ? '' : 'none';
  });

  function checkedTechniqueKeys() {
    return Array.from(document.querySelectorAll('#varTechs .var-tech'))
      .filter((cb) => cb.checked).map((cb) => cb.value);
  }

  // Build the engine's voiceNotes + chordByMeasure + variations for the current segment/voice.
  document.getElementById('varGenerate').onclick = () => {
    if (!currentDetail || !currentDetail.voices || !currentDetail.voices.length) return;
    const { from, to } = varSegRange();
    if (!Number.isFinite(from) || !Number.isFinite(to)) return;
    // Self-contained guardrail: don't rely solely on the disabled button.
    if (to - from + 1 > 3) { refreshVariationsGuardrail(); return; }

    const chordByMeasure = buildChordByMeasure(collapsedChordSpans(currentDetail));
    const pickIdx = parseInt(document.getElementById('varVoice').value, 10) || 0;
    const entry = varEntries[pickIdx] || varEntries[0];
    if (!entry) return;
    // Split entries embellish a two-voice working copy (melody='1', bass='2') of a single-voice
    // piece; real voices work off the raw source. varWorkingSource/varGenVoiceId are the segment +
    // <voice> id every later step (render/play/fretboard) must reuse.
    const workingSource = entry.split ? splitSingleVoice(currentDetail.source) : currentDetail.source;
    varWorkingSource = workingSource;
    varGenVoiceId = entry.voiceId;

    const style = document.getElementById('varStyle').value;
    if (style === 'contrapuntal') {
      // Contrapuntal: generate independent counter-lines that move against the chosen voice's
      // melody. Each "variation" carries a whole counter-line; renderSelectedVariation writes it as
      // a fresh colored voice. No per-note edits, so skip the classical note-list + alignment guard.
      // Work entirely in SEGMENT-RELATIVE 1..N numbering: extractSegmentXml renumbers kept measures
      // to 1..N by position, and renderSelectedVariation writes into that same renumbered segment —
      // so the counter-line's measure values must be 1..N, not the absolute from..to.
      const N = to - from + 1;
      const seg = extractSegmentXml(workingSource, [from, to]);   // measures renumbered 1..N (by position)
      // Chord map in SEGMENT-RELATIVE numbering: relative m (1..N) → the sequential chord at (from+m-1).
      const relChord = {};
      for (let m = 1; m <= N; m++) relChord[m] = chordByMeasure[from + m - 1] || null;
      const melody = buildBeatNotes(seg, entry.voiceId, 1, N);    // reads the seg's renumbered 1..N
      const lines = generateCounterLines({
        melody,
        chordByMeasure: relChord,
        key: currentDetail.meta && currentDetail.meta.key,
        register: document.getElementById('varRegister').value,
      });
      // Counter voice id = the first integer id not already used in the working source.
      const used = new Set(distinctVoiceIdsInOrder(workingSource).map(String));
      let counterId = 2; while (used.has(String(counterId))) counterId++;
      varCounterVoiceId = String(counterId);
      variations = lines.map((line, i) => ({ label: line.label || `Counter-line ${i + 1}`, isContrapuntal: true, line }));
      varGenVoiceIds = [entry.voiceId, varCounterVoiceId];
    } else {
      // Classical / bluesy: decorate the chosen voice in place with non-chord-tone techniques.
      // Engine note-list for the chosen voice, sourced from the working copy. For a split entry the
      // synthetic voice has no currentDetail.voices[…] entry, so re-encode the working source and pull
      // its voice by ordered id; real voices come from the pre-encoded currentDetail.voices.
      let voiceNotes;
      if (entry.split) {
        const encoded = encodeMusicXml(workingSource);
        const wids = orderedVoiceIds(workingSource);
        const widx = Math.max(0, wids.indexOf(String(entry.voiceId)));
        voiceNotes = buildVoiceNotes(encoded.voices[widx] || encoded.voices[0], from, to, chordByMeasure);
      } else {
        voiceNotes = buildVoiceNotes(currentDetail.voices[pickIdx], from, to, chordByMeasure);
      }

      // Alignment safety: the XML builder addresses one note per onset (skips <rest>/<chord/>).
      // If its addressable count differs from our collapsed engine list, edits would land on the
      // wrong notes — warn (still proceed) so the mismatch surfaces during manual testing.
      try {
        const addr = addressableMidis(extractSegmentXml(workingSource, [from, to]), entry.voiceId);
        if (addr.length !== voiceNotes.length) {
          console.warn(`[variations] note-list misalignment: engine ${voiceNotes.length} vs XML builder `
            + `${addr.length} for entry "${entry.label}" (id ${entry.voiceId}) over measures ${from}-${to}. `
            + 'Edits may land on the wrong notes.');
        }
      } catch (err) { console.warn('[variations] alignment check failed:', err); }

      // Default pool = pitch classes present across ALL voices in the segment.
      const segmentNoteNames = currentDetail.voices.flatMap((v) =>
        v.name.filter((_, i) => v.measureIndex[i] >= from && v.measureIndex[i] <= to));

      variations = generateVariations({
        voiceNotes,
        chordByMeasure,
        segmentNoteNames,
        key: currentDetail.meta && currentDetail.meta.key,
        style,
        techniques: checkedTechniqueKeys(),
        addNotes: document.getElementById('varAddNotes').checked,
        shuffle: document.getElementById('varShuffle') ? document.getElementById('varShuffle').checked : false,
        cap: 50,
      });
      varGenVoiceIds = [entry.voiceId];
    }
    varGenRange = [from, to];       // freeze the range/voice the edits were indexed against
    populateVarSelect();            // fill the select, select the first, and render it
  };

  // Fill the selectbox from the generated variations, enable/disable the controls, and auto-render
  // the first option. When there are none, clear + disable everything and show the empty state.
  function populateVarSelect() {
    const sel = document.getElementById('varSelect');
    const empty = document.getElementById('varEmpty');
    const playBtn = document.getElementById('varPlay');
    const fretBtn = document.getElementById('varFret');
    const silenceBtn = document.getElementById('varSilence');
    const hearBtn = document.getElementById('varHearAll');
    const saveBtn = document.getElementById('varSaveVocab');
    if (!sel) return;
    stopVarPlayback();
    sel.innerHTML = '';
    // A fresh generation invalidates the per-variation silence memory and resets the toggles.
    varSilences.clear(); varRenderedIndex = -1;
    varSilenceMode = false; varHearAll = false; reflectVarSilence(); updateVarSilenceHint();
    if (!variations.length) {
      sel.disabled = playBtn.disabled = fretBtn.disabled = silenceBtn.disabled = hearBtn.disabled = saveBtn.disabled = true;
      empty.style.display = '';
      const styleSel = document.getElementById('varStyle');
      const isContrapuntal = styleSel && styleSel.value === 'contrapuntal';
      empty.textContent = varGenRange
        ? (isContrapuntal
          ? 'No counter-lines for this segment (a measure may lack a detected chord).'
          : 'No variations for these techniques on this segment.')
        : 'Generate variations to preview them here.';
      currentVarXml = null;
      if (varRenderer && document.getElementById('varSheet')) document.getElementById('varSheet').innerHTML = '';
      return;
    }
    variations.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = String(i); opt.textContent = v.label;
      sel.appendChild(opt);
    });
    sel.disabled = playBtn.disabled = fretBtn.disabled = silenceBtn.disabled = hearBtn.disabled = saveBtn.disabled = false;
    empty.style.display = 'none';
    sel.selectedIndex = 0;
    renderSelectedVariation();
  }

  // Lazily create the shared render panel bound to #varSheet.
  function ensureVarRenderer() {
    if (!varRenderer) varRenderer = createMusicRenderer(document.getElementById('varSheet'), {
      // A notehead click (in silence mode) or Hear-all change fires this; remember the silenced
      // notes against the variation currently shown, and refresh the count hint.
      onSuppressionChange: () => {
        if (varRenderedIndex >= 0) varSilences.set(varRenderedIndex, varRenderer.getSuppressedNotes());
        updateVarSilenceHint();
      },
    });
    return varRenderer;
  }

  // Lazily create the dedicated variation player; its cursor follows on #varSheet's OSMD.
  function ensureVarPlayer() {
    if (!varPlayer) varPlayer = createMusicPlayer({
      getCursor: () => (varRenderer && varRenderer.osmd ? varRenderer.osmd.cursor : null),
      // Natural end (played to the segment boundary): reset the ▶/⏹ toggle. Inline (not
      // stopVarPlayback) so we don't re-enter the player's stop() from inside its own stop.
      onEnd: () => { varPlaying = false; const b = document.getElementById('varPlay'); if (b) b.textContent = '▶ Play'; },
    });
    return varPlayer;
  }

  // Stop any in-progress variation playback and reset the cursor + the #varPlay button label.
  function stopVarPlayback() {
    if (varPlayer && varPlaying) { try { varPlayer.stop(); } catch (_) {} }
    varPlaying = false;
    const btn = document.getElementById('varPlay');
    if (btn) btn.textContent = '▶ Play';
  }

  // Render the currently-selected variation: extract the frozen segment, apply its edits to the
  // generated voice, render into #varSheet, then color the ADDED notes (after render so the
  // noteheads exist). Stores the embellished XML in currentVarXml for play/fretboard.
  async function renderSelectedVariation() {
    stopVarPlayback();
    const sel = document.getElementById('varSelect');
    const v = variations[sel.selectedIndex];
    if (!v || !currentDetail || !varGenRange) return;
    const seg = extractSegmentXml(varWorkingSource || currentDetail.source, varGenRange);
    let varXml;
    if (v.isContrapuntal) {
      // Realize the counter-line as a fresh colored voice grafted onto the frozen segment; the
      // ADDED_NOTE_COLOR lets coloredNoteMarks() find its notes for highlighting below.
      const doc = new DOMParser().parseFromString(seg, 'application/xml');
      writeVoice(doc, { voiceId: varCounterVoiceId, notesByMeasure: counterLineToNotesByMeasure(v.line, seg), color: ADDED_NOTE_COLOR });
      varXml = new XMLSerializer().serializeToString(doc);
    } else {
      varXml = applyVariation(seg, varGenVoiceId, v.edits);
    }
    currentVarXml = varXml;
    const r = ensureVarRenderer();
    try {
      await r.loadDetail({ source: varXml, meta: { key: currentDetail.meta && currentDetail.meta.key }, format: 'musicxml', voices: [] });
      r.showFull();
      const marks = coloredNoteMarks(varXml);
      r.highlightExtraNotes(marks, ADDED_NOTE_COLOR);
      // Restore this variation's own silenced notes + the persistent silence/hear-all toggle state.
      // setSuppressedNotes replaces the set (and resets hearAll), so re-apply hearAll after.
      varRenderedIndex = sel.selectedIndex;
      r.setSuppressedNotes(varSilences.get(varRenderedIndex) || []);
      r.setSuppressMode(varSilenceMode);
      if (varHearAll) r.setHearAll(true);
      updateVarSilenceHint();
    } catch (err) { console.warn('[variations] render failed:', err); }
  }
  document.getElementById('varSelect').onchange = renderSelectedVariation;

  // Reflect the silence / hear-all toggle button states.
  function reflectVarSilence() {
    const s = document.getElementById('varSilence');
    const h = document.getElementById('varHearAll');
    if (s) s.classList.toggle('active', varSilenceMode);
    if (h) h.classList.toggle('active', varHearAll);
  }
  // Show how many notes are silenced on the current variation.
  function updateVarSilenceHint() {
    const hint = document.getElementById('varSilenceHint');
    if (!hint) return;
    const n = (varRenderer && varRenderer.getSuppressedNotes) ? varRenderer.getSuppressedNotes().length : 0;
    hint.textContent = n ? `${n} silenced` : '';
  }
  // 🔇 Silence: when on, clicking a notehead on the variation sheet silences/un-silences it (dimmed,
  // and skipped by ▶ Play). The mode persists as you switch variations; the silenced notes are
  // remembered per variation (see varSilences).
  document.getElementById('varSilence').onclick = () => {
    varSilenceMode = !varSilenceMode;
    if (varRenderer) varRenderer.setSuppressMode(varSilenceMode);
    reflectVarSilence();
  };
  // 👂 Hear all: transiently un-mute every silenced note without clearing the set.
  document.getElementById('varHearAll').onclick = () => {
    varHearAll = !varHearAll;
    if (varRenderer) varRenderer.setHearAll(varHearAll);
    reflectVarSilence();
  };
  // ➕ Save to vocab: persist the CURRENT variation as a vocabulary item. Unlike a normal capture
  // (which only references the source passage), this stores the variation's own embellished MusicXML
  // so re-opening replays it exactly, plus its silenced notes and fretboard voice ids. Auto-filed
  // under the "variations" category (or the typed category); the note records style + which variation.
  document.getElementById('varSaveVocab').onclick = async () => {
    if (!currentVarXml || !currentPreviewId || !varGenRange) { setMediaMsg('Generate a variation first.', 'info'); return; }
    const [from, to] = varGenRange;                       // sequential segment span the variation covers
    const styleSel = document.getElementById('varStyle');
    const styleTxt = (styleSel && styleSel.options[styleSel.selectedIndex]) ? styleSel.options[styleSel.selectedIndex].textContent : '';
    const vSel = document.getElementById('varSelect');
    const varTxt = (vSel && vSel.options[vSel.selectedIndex]) ? vSel.options[vSel.selectedIndex].textContent : '';
    const label = [styleTxt, varTxt].filter(Boolean).join(' — ') || 'Variation';
    const cat = document.getElementById('vocabCat').value.trim();
    const entry = buildVocabEntry({
      pieceId: currentPreviewId, system, measureRange: [from, to],
      measureOffset: currentOffset,
      youtube: (currentDetail.meta && currentDetail.meta.youtube) || null,
      note: label,
      snapshot: buildSnapshot(currentDetail, [from, to]),  // original-passage pitches, for search/context
      suppressed: (varRenderer && varRenderer.getSuppressedNotes) ? varRenderer.getSuppressedNotes() : [],
      category: cat || 'variations',
      createdAt: new Date().toISOString().slice(0, 10),
      variationXml: currentVarXml,                         // the actual embellished notes → replays as-is
      variationLabel: label,
      variationVoiceIds: [...varGenVoiceIds],
    });
    entry.id = uniqueVocabId(vocab, entry.id);             // never clobber a normal item / another saved variation
    vocab = upsertVocab(vocab, entry);
    renderVocab();
    try { await store.putVocab(system, vocab); } catch (_) {}
    dirtyVocab = true; updatePushBtn();
    setMediaMsg(`Saved variation "${label}" to vocab (${vocab.length} total) — click "Push changes" to publish.`, 'ok');
  };

  // ▶ Play / ⏹ Stop toggle: play the current variation's XML with the OSMD cursor following on
  // #varSheet. Mirrors the main preview play path (setInstrument → setSchedule → play), on a
  // dedicated player so the cursor tracks #varSheet, not #osmdPreview.
  document.getElementById('varPlay').onclick = () => {
    if (varPlaying) { stopVarPlayback(); return; }
    if (!currentVarXml) return;
    // Skip the notes silenced on this variation (keeps their slot, mutes the synth) — mirrors the
    // main preview's muted-notes path.
    const muted = (varRenderer && varRenderer.getMutedNotes) ? varRenderer.getMutedNotes() : [];
    const schedule = buildScheduleFromMusicXml(currentVarXml, { tempo: currentTempo(), mutedNotes: muted });
    if (!schedule.length) return;
    if (player) player.stop();   // don't overlap the main preview on the shared Tone.Transport
    const p = ensureVarPlayer();
    p.setInstrument(document.getElementById('instrSel').value);
    p.setSchedule(schedule, { cursorStartStep: 0 });
    p.setLoop(false);
    varPlaying = true;
    document.getElementById('varPlay').textContent = '⏹ Stop';
    p.play().catch((err) => { console.warn('[variations] playback error:', err); stopVarPlayback(); });
  };

  // Build fretboard steps from the current variation's embellished voice: ONE step per BEAT
  // (quarter-note pulse), each holding that beat's notes. See variationFretSteps — grouping by beat
  // bounds each step's voicings and avoids the ~10^16-combo cartesian blow-up that killed the page.
  // ADDED notes are ringed via highlightMidis.
  function buildVariationSteps() {
    if (!currentVarXml) return [];
    return variationFretSteps(currentVarXml, varGenVoiceIds.length > 1 ? varGenVoiceIds : varGenVoiceIds[0]);
  }

  // 🎸 Fretboard: capture the current variation onto the fretboard, ringing the ADDED notes, and
  // open the fretboard panel. Initializes the renderer/fretboard lazily if not yet created.
  document.getElementById('varFret').onclick = () => {
    if (!currentVarXml) return;
    if (!fbPanel) ensureRenderer();   // fretboard is created inside ensureRenderer()
    if (!fbPanel) return;             // guard: still unavailable (no piece loaded)
    const steps = buildVariationSteps();
    if (!steps.length) return;
    const highlightMidis = coloredNoteMarks(currentVarXml).map((m) => m.midi);
    // Track the cursor on the VARIATION sheet (these steps came from #varSheet, not the main preview).
    fbPanel.captureSteps(steps, { highlightMidis, cursorRenderer: varRenderer });
    const panel = document.getElementById('fretboardPanel');
    if (panel && !panel.open) panel.open = true;
  };
  document.getElementById('previewCloseBtn').onclick = () => {
    if (player) player.stop();
    clearYtMonitor(); if (yt) yt.pause();
    paused = false; ytPlaying = false; updatePauseLabel();
    document.getElementById('musicPreview').style.display = 'none';
    document.getElementById('suppressPanel').style.display = 'none';
    if (renderer) { renderer.setSuppressedNotes([]); renderer.setSuppressMode(false); }
    document.getElementById('suppressModeChk').checked = false;
    document.getElementById('hearAllChk').checked = false;
    syncToggles();
    document.body.classList.remove('preview-open');
  };
  // Toggle native fullscreen on the preview pane (webkit fallback for Safari).
  document.getElementById('previewFullscreenBtn').onclick = () => {
    const el = document.getElementById('musicPreview');
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    else { (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
  };
  // Re-fit the score to the (new) viewport width whenever fullscreen enters/exits.
  ['fullscreenchange', 'webkitfullscreenchange'].forEach((ev) => document.addEventListener(ev, () => {
    if (renderer && renderer.applyResponsiveZoom) renderer.applyResponsiveZoom(window.innerWidth);
  }));

  // ---- Search UI (Layout C) ----
  const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const QUALITIES = ['maj', 'min', 'dim', 'aug'];
  const EXTENSIONS = ['add9', '7', 'maj7', '6', '9', 'sus4'];

  function addChip() {
    const chip = document.createElement('div');
    chip.className = 'chordChip';
    const rootSel = document.createElement('select');
    NOTE_NAMES.forEach(n => rootSel.add(new Option(n, n)));
    const qualSel = document.createElement('select');
    QUALITIES.forEach(q => qualSel.add(new Option(q, q)));
    chip.appendChild(rootSel);
    chip.appendChild(qualSel);
    EXTENSIONS.forEach(ext => {
      const pill = document.createElement('button');
      pill.type = 'button'; pill.className = 'extPill'; pill.textContent = ext; pill.dataset.ext = ext;
      pill.onclick = () => pill.classList.toggle('active');
      chip.appendChild(pill);
    });
    const del = document.createElement('button');
    del.type = 'button'; del.textContent = '×'; del.onclick = () => chip.remove();
    chip.appendChild(del);
    document.getElementById('chips').appendChild(chip);
  }
  function readChips() {
    return Array.from(document.querySelectorAll('#chips .chordChip')).map(chip => {
      const sels = chip.querySelectorAll('select');
      return {
        root: sels[0].value, quality: sels[1].value,
        extensions: Array.from(chip.querySelectorAll('.extPill.active')).map(p => p.dataset.ext),
      };
    });
  }
  function buildNoteButtons() {
    const box = document.getElementById('noteButtons');
    const append = (tok) => { const t = document.getElementById('melodyTokens'); t.value = (t.value ? t.value + ' ' : '') + tok; };
    [...NOTE_NAMES, '.'].forEach(tok => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = tok; b.onclick = () => append(tok);
      box.appendChild(b);
    });
    const clr = document.createElement('button');
    clr.type = 'button'; clr.textContent = 'clear'; clr.onclick = () => { document.getElementById('melodyTokens').value = ''; };
    box.appendChild(clr);
  }
  function currentMode() {
    return document.querySelector('input[name="searchMode"]:checked').value;
  }
  function maxResultsVal() {
    const n = parseInt(document.getElementById('maxResults').value, 10);
    return Number.isFinite(n) && n > 0 ? n : undefined;
  }
  function buildQuery() {
    if (currentMode() === 'chord') {
      return buildChordQuery(readChips(), {
        strict_extensions: document.getElementById('strictExt').checked,
        max_gap: parseInt(document.getElementById('maxGap').value, 10) || 0,
        transpose_invariant: document.getElementById('transposeInv').checked,
        max_results: maxResultsVal(),
      });
    }
    const tokens = document.getElementById('melodyTokens').value.trim().split(/\s+/).filter(Boolean);
    return buildMelodyQuery(tokens, {
      search_by_interval: document.getElementById('byInterval').checked,
      pitch_tolerance: parseInt(document.getElementById('pitchTol').value, 10) || 0,
      max_results: maxResultsVal(),
    });
  }
  function renderResults(results) {
    const box = document.getElementById('results');
    if (!results.length) { box.innerHTML = '<em>No matches.</em>'; return; }
    box.innerHTML = '';
    results.forEach(r => {
      const title = (index.find(e => e.id === r.pieceId) || {}).title || r.pieceId;
      const row = document.createElement('div');
      row.className = 'resultRow';
      row.innerHTML = `<strong>${title}</strong><br><small>${matchSummary(r)}</small>`;
      row.onclick = () => openResult(r);
      box.appendChild(row);
    });
  }
  async function openResult(result) {
    await openPreview(result.pieceId);
    if (!currentDetail) return;   // note-text or failed render: detail pane shows its own message
    const mr = resolveMatchMeasures(currentDetail, result.match);   // sequential
    if (mr) {
      document.getElementById('segFrom').value = toPrintedMeasure(mr[0]);
      document.getElementById('segTo').value = toPrintedMeasure(mr[1]);
      if (renderer) { renderer.showSegment(mr); renderer.highlightMeasures(mr); }
      // Call out exactly what matched at these measures as clickable chips — the searched chords may
      // be labelled differently by the live on-sheet overlay, so clicking a chip lights up exactly
      // the notes that formed that chord at its own measure(s), letting the user verify the match.
      const m = result.match;
      if (m.kind === 'chord' && (m.symbols || []).length) renderMatchedChords(m, mr);
    }
  }
  // Render "Matched: [chip] [chip] … · measures X–Y" into previewMsg. Each chip highlights the notes
  // that form its chord at its measure span (from the match's exact chord indices); click again to clear.
  function renderMatchedChords(match, mr) {
    const host = document.getElementById('previewMsg');
    host.textContent = '';
    host.appendChild(document.createTextNode('Matched: '));
    const spans = currentDetail ? collapsedChordSpans(currentDetail) : [];
    const indices = match.indices || [];
    (match.symbols || []).forEach((sym, i) => {
      const span = spans[indices[i]];                    // this chip's own measure span
      const range = span ? [span.measureStart, span.measureEnd] : mr;
      const chip = document.createElement('button');
      chip.className = 'match-chip';
      chip.textContent = chordDisplayName(sym);
      chip.title = `Show the notes that form ${chordDisplayName(sym)} (measure ${toPrintedMeasure(range[0])})`;
      chip.onclick = () => {
        const wasOn = chip.classList.contains('on');
        host.querySelectorAll('.match-chip.on').forEach((c) => c.classList.remove('on'));
        if (wasOn) { if (renderer) renderer.clearHighlight(); return; }
        chip.classList.add('on');
        if (renderer) renderer.highlightMatchedChord(sym, range);
      };
      host.appendChild(chip);
    });
    host.appendChild(document.createTextNode(`  ·  measures ${toPrintedMeasure(mr[0])}–${toPrintedMeasure(mr[1])}`));
  }
  // Re-open a saved VARIATION vocab item: open its piece for context, then render the stored
  // embellished MusicXML on the Variations sheet and enable the controls so it plays / silences /
  // captures exactly as saved. Self-contained — driven by entry.variationXml, not the source passage.
  async function openVariationVocabEntry(entry) {
    await openPreview(entry.pieceId);
    const from = entry.measureStart, to = entry.measureEnd;   // sequential (stored)
    document.getElementById('segFrom').value = toPrintedMeasure(from);
    document.getElementById('segTo').value = toPrintedMeasure(to);
    // Freeze variation state to this saved item (no generated set — the controls act on currentVarXml).
    variations = [];
    varGenRange = [from, to];
    varGenVoiceIds = (entry.variationVoiceIds && entry.variationVoiceIds.length) ? [...entry.variationVoiceIds] : ['1'];
    currentVarXml = entry.variationXml;
    varSilenceMode = false; varHearAll = false; varRenderedIndex = -1;
    const r = ensureVarRenderer();
    try {
      await r.loadDetail({ source: entry.variationXml, meta: { key: (currentDetail && currentDetail.meta && currentDetail.meta.key) || null }, format: 'musicxml', voices: [] });
      r.showFull();
      r.highlightExtraNotes(coloredNoteMarks(entry.variationXml), ADDED_NOTE_COLOR);
      r.setSuppressedNotes(entry.suppressed || []);
      r.setSuppressMode(false);
    } catch (err) { console.warn('[variations] saved-variation render failed:', err); }
    // The picker has no generated options; enable the controls that act on currentVarXml directly.
    const sel = document.getElementById('varSelect'); if (sel) { sel.innerHTML = ''; sel.disabled = true; }
    ['varPlay', 'varFret', 'varSilence', 'varHearAll', 'varSaveVocab'].forEach((id) => { const b = document.getElementById(id); if (b) b.disabled = false; });
    document.getElementById('varEmpty').style.display = 'none';
    reflectVarSilence(); updateVarSilenceHint();
    const panel = document.getElementById('variationsSection');
    if (panel) { panel.open = true; panel.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    setMediaMsg(`Opened saved variation “${entry.variationLabel || entry.note || entry.id}”.`, 'ok');
  }
  async function openVocabEntry(entry) {
    if (entry.variationXml) { await openVariationVocabEntry(entry); return; }   // saved variation → replay its own XML
    await openPreview(entry.pieceId);
    if (!currentDetail) return;
    currentVocabEntry = entry;
    const from = entry.measureStart, to = entry.measureEnd;   // sequential (stored)
    document.getElementById('segFrom').value = toPrintedMeasure(from);
    document.getElementById('segTo').value = toPrintedMeasure(to);
    document.getElementById('vocabCat').value = (entry.category && entry.category !== 'uncategorized') ? entry.category : '';
    document.getElementById('vocabNote').value = entry.note || '';
    if (entry.startSeconds != null) document.getElementById('guessSec').value = entry.startSeconds;
    if (entry.endSeconds != null) document.getElementById('guessEndSec').value = entry.endSeconds;
    if (renderer) { renderer.showSegment([from, to]); renderer.highlightMeasures([from, to]); }
    if (renderer) renderer.setSuppressedNotes(entry.suppressed || []);
    document.getElementById('suppressModeChk').checked = false;
    document.getElementById('hearAllChk').checked = false;
    document.getElementById('voiceChips').style.display = 'none';
    document.getElementById('suppressPanel').style.display = '';
    syncToggles();           // reflect suppress-mode/hear-all buttons as off
    onSuppressionChange();   // refresh chips + hint
    // Restore the manually-picked chords: show the overlay and pre-select those labels.
    const savedChords = entry.chords || (entry.chord ? [entry.chord] : []);   // back-compat with old single-chord entries
    if (savedChords.length && renderer) {
      document.getElementById('chordChk').checked = true;
      renderer.setShowChords(true);
      renderer.setSelectedChords(savedChords);
    }
    syncToggles();   // reflect the (programmatic) Show-chords state on its toggle button
    updateAddVocabLabel();
  }
  // Delete a vocab item after confirmation: drop it locally, re-render, then push the new vocab.json.
  async function deleteVocabEntry(entry) {
    if (!window.confirm(`Delete vocab item “${entry.id}”?\n\nThis removes it for good.`)) return;
    vocab = vocab.filter(v => v.id !== entry.id);
    if (currentVocabEntry && currentVocabEntry.id === entry.id) { currentVocabEntry = null; updateAddVocabLabel(); }
    renderVocab();
    try { await store.putVocab(system, vocab); } catch (_) {}
    dirtyVocab = true; updatePushBtn();
    setMediaMsg(`Deleted “${entry.id}” locally — click "Push changes" to publish.`, 'ok');
  }
  function renderVocab() {
    const box = document.getElementById('vocabList');
    const groups = groupVocabByCategory(vocab);
    if (!groups.length) { box.innerHTML = '<em>No vocabulary yet.</em>'; return; }
    box.innerHTML = '';
    groups.forEach(g => {
      const h = document.createElement('div');
      h.innerHTML = `<strong>${g.category}</strong>`;
      box.appendChild(h);
      g.entries.forEach(e => {
        const title = (index.find(x => x.id === e.pieceId) || {}).title || e.pieceId;
        const mark = (e.startSeconds != null || e.youtube) ? ' ▶' : '';
        const varMark = e.variationXml ? '🎶 ' : '';   // a saved variation replays its own embellished notes
        const noteHtml = e.note ? ` <small style="color:#666">— ${escapeHtml(e.note)}</small>` : '';
        const off = e.measureOffset || 0;   // show the item's PRINTED measure numbers
        const row = document.createElement('div');
        row.className = 'resultRow vocabRow';
        const label = document.createElement('span');
        label.className = 'vocabLabel';
        label.innerHTML = `${varMark}${title} <small>m${e.measureStart - off}–${e.measureEnd - off}${mark}</small>${noteHtml}`;
        label.onclick = () => openVocabEntry(e);
        const del = document.createElement('button');
        del.className = 'vocabDel'; del.title = 'Delete this vocab item'; del.textContent = '🗑';
        del.onclick = (ev) => { ev.stopPropagation(); deleteVocabEntry(e); };
        row.appendChild(label);
        row.appendChild(del);
        box.appendChild(row);
      });
    });
  }
  document.querySelectorAll('input[name="searchMode"]').forEach(radio => {
    radio.onchange = () => {
      document.getElementById('chordMode').style.display = currentMode() === 'chord' ? '' : 'none';
      document.getElementById('melodyMode').style.display = currentMode() === 'melody' ? '' : 'none';
    };
  });
  document.getElementById('addChipBtn').onclick = addChip;
  document.getElementById('searchBtn').onclick = () => {
    let query;
    try { query = buildQuery(); } catch (e) { document.getElementById('searchMsg').textContent = e.message; return; }
    let results;
    try { results = runQuery(query, filterByTags(index, tagFilter)); }
    catch (e) { document.getElementById('searchMsg').textContent = 'Invalid query: ' + e.message; return; }
    const tagNote = tagFilter.size ? ` (tags: ${[...tagFilter].join(', ')})` : '';
    document.getElementById('searchMsg').textContent = `${results.length} match${results.length === 1 ? '' : 'es'}${tagNote}`;
    renderResults(results);
  };
  addChip();            // start with one chord chip
  buildNoteButtons();   // populate the melody note-picker

  // ===== Weekly practice log (local-only) =====
  function savePractice() {
    if (!store || !store.putPractice) return;
    try { const p = store.putPractice(system, { entries: practiceEntries, fields: practiceFields }); if (p && p.catch) p.catch(() => {}); } catch (_) {}
  }
  function newEntryId() { return `pl_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`; }
  // Parse an <input type=date> 'YYYY-MM-DD' as a LOCAL date (new Date('YYYY-MM-DD') is UTC and can
  // shift the day across a timezone — which would land weekStart on the wrong week).
  function parseDateInput(v) {
    const [y, m, d] = String(v || '').split('-').map(Number);
    return (y && m && d) ? new Date(y, m - 1, d) : new Date();
  }
  function fillStatusSelect(sel, value) {
    sel.innerHTML = PRACTICE_STATUSES.map(s => `<option value="${s.value}"${s.value === value ? ' selected' : ''}>${esc(s.label)}</option>`).join('');
  }
  function statusBadge(value) {
    const m = statusMeta(value);
    return `<span class="pl-status-badge" style="background:${m.color}">${esc(m.label)}</span>`;
  }
  function fieldDatalist() {
    document.getElementById('plFieldNames').innerHTML = practiceFields.map(f => `<option value="${esc(f)}"></option>`).join('');
  }
  // Populate the piece dropdown + field-name datalist + status selects from current state.
  function refreshPracticeInputs() {
    const pieceSel = document.getElementById('plPiece');
    const cur = pieceSel.value;
    pieceSel.innerHTML = '<option value="">— none —</option>'
      + index.map(e => `<option value="${esc(e.id)}">${esc(e.title || e.id)}</option>`).join('');
    pieceSel.value = cur;
    fieldDatalist();
    if (!document.getElementById('plStatus').options.length) fillStatusSelect(document.getElementById('plStatus'), 'planned');
    if (!document.getElementById('plFieldStatus').options.length) fillStatusSelect(document.getElementById('plFieldStatus'), 'planned');
  }
  function renderPracticeDraft() {
    document.getElementById('plFieldRows').innerHTML = practiceDraft.map((f, i) =>
      `<div class="pl-field-row"><span class="pl-fname">${esc(f.name)}</span>`
      + `<span class="pl-fval">${esc(f.value)}</span>${statusBadge(f.status)}`
      + ` <button type="button" class="pl-fx" data-i="${i}" title="Remove field">✕</button></div>`).join('');
  }
  function renderPracticeList() {
    const rows = sortEntries(practiceEntries).map(e => {
      const piece = e.pieceId ? ` <span class="pl-piece-link" data-piece="${esc(e.pieceId)}">▶ ${esc(e.pieceTitle || e.pieceId)}</span>` : '';
      const fields = (e.custom || []).map(f =>
        `<span class="pl-chip"><span class="pl-dot" style="background:${statusMeta(f.status).color}"></span><strong>${esc(f.name)}:</strong> ${esc(f.value)}</span>`).join('');
      return `<div class="pl-entry" data-id="${esc(e.id)}"><div class="pl-entry-head">`
        + `<span class="pl-entry-week">${esc(weekLabel(e.week))}</span>${statusBadge(e.status)}`
        + `<span class="pl-entry-goal">${esc(e.goal)}</span>${piece}`
        + `<button type="button" class="icon-btn pl-edit" data-id="${esc(e.id)}" title="Edit">✎</button>`
        + `<button type="button" class="icon-btn pl-del" data-id="${esc(e.id)}" title="Delete">🗑</button></div>`
        + (e.notes ? `<div class="pl-entry-notes">${esc(e.notes)}</div>` : '')
        + (fields ? `<div class="pl-entry-fields">${fields}</div>` : '')
        + `</div>`;
    });
    document.getElementById('practiceList').innerHTML = rows.join('') || '<em style="color:#888;font-size:13px">No practice entries yet.</em>';
  }
  function renderPractice() { refreshPracticeInputs(); renderPracticeDraft(); renderPracticeList(); }
  function resetPracticeForm() {
    practiceEditId = null; practiceDraft = [];
    document.getElementById('plWeek').value = weekStart(new Date());
    document.getElementById('plGoal').value = '';
    document.getElementById('plNotes').value = '';
    document.getElementById('plPiece').value = '';
    fillStatusSelect(document.getElementById('plStatus'), 'planned');
    fillStatusSelect(document.getElementById('plFieldStatus'), 'planned');
    document.getElementById('plSave').textContent = 'Save entry';
    document.getElementById('plFormMsg').textContent = '';
    renderPracticeDraft();
  }
  // Add a custom field: register a new name globally, append it to the form's draft.
  document.getElementById('plAddField').addEventListener('click', () => {
    const nameInp = document.getElementById('plFieldName');
    const valInp = document.getElementById('plFieldValue');
    const merged = mergeFieldName(practiceFields, nameInp.value);
    if (!merged.name) { nameInp.focus(); return; }
    practiceFields = merged.fields;
    if (merged.added) { savePractice(); fieldDatalist(); }   // persist the new field name globally
    practiceDraft.push({ name: merged.name, value: valInp.value.trim(), status: document.getElementById('plFieldStatus').value });
    nameInp.value = ''; valInp.value = '';
    renderPracticeDraft();
  });
  document.getElementById('plFieldRows').addEventListener('click', (ev) => {
    const x = ev.target.closest('.pl-fx'); if (!x) return;
    practiceDraft.splice(parseInt(x.dataset.i, 10), 1);
    renderPracticeDraft();
  });
  document.getElementById('plSave').addEventListener('click', () => {
    const week = weekStart(parseDateInput(document.getElementById('plWeek').value));
    const goal = document.getElementById('plGoal').value.trim();
    const notes = document.getElementById('plNotes').value.trim();
    const pieceId = document.getElementById('plPiece').value || null;
    const status = document.getElementById('plStatus').value;
    if (!goal && !notes && !pieceId && !practiceDraft.length) {
      document.getElementById('plFormMsg').textContent = 'Add a goal, note, piece, or field first.'; return;
    }
    const pieceTitle = pieceId ? ((index.find(e => e.id === pieceId) || {}).title || pieceId) : '';
    const entry = makeEntry({ id: practiceEditId || newEntryId(), week, pieceId, pieceTitle, goal, status, notes,
      custom: practiceDraft, updatedAt: new Date().toISOString() });
    practiceEntries = upsertEntry(practiceEntries, entry);
    savePractice(); resetPracticeForm(); renderPracticeList();
    document.getElementById('plFormMsg').textContent = 'Saved.';
  });
  document.getElementById('plClear').addEventListener('click', resetPracticeForm);
  document.getElementById('practiceList').addEventListener('click', (ev) => {
    const link = ev.target.closest('.pl-piece-link');
    if (link) { openPreview(link.dataset.piece); return; }
    const edit = ev.target.closest('.pl-edit');
    if (edit) {
      const e = practiceEntries.find(x => x.id === edit.dataset.id); if (!e) return;
      practiceEditId = e.id;
      refreshPracticeInputs();
      document.getElementById('plWeek').value = e.week;
      document.getElementById('plGoal').value = e.goal;
      document.getElementById('plNotes').value = e.notes;
      document.getElementById('plPiece').value = e.pieceId || '';
      fillStatusSelect(document.getElementById('plStatus'), e.status);
      practiceDraft = (e.custom || []).map(f => ({ ...f }));
      renderPracticeDraft();
      document.getElementById('plSave').textContent = 'Update entry';
      document.getElementById('plFormMsg').textContent = `Editing ${weekLabel(e.week)}…`;
      document.getElementById('practiceSection').open = true;
      document.getElementById('plGoal').focus();
      return;
    }
    const del = ev.target.closest('.pl-del');
    if (del) {
      if (!window.confirm('Delete this practice entry?')) return;
      practiceEntries = removeEntry(practiceEntries, del.dataset.id);
      if (practiceEditId === del.dataset.id) resetPracticeForm();
      savePractice(); renderPracticeList();
    }
  });
  // Keep the piece dropdown current when the panel is opened.
  document.getElementById('practiceSection').addEventListener('toggle', (e) => { if (e.target.open) refreshPracticeInputs(); });

  (async () => {
    try { const lib = await loadLibrary(system, store); index = lib.index; unpushedIds = lib.unpushedIds; }
    catch (_) { index = []; unpushedIds = new Set(); }
    try { vocab = await loadVocab(system, store); } catch (_) { vocab = []; }
    try { tagRegistry = await loadTagRegistry(); } catch (_) { tagRegistry = []; }
    try { const pl = await store.getPractice(system); practiceEntries = pl.entries || []; practiceFields = pl.fields || []; }
    catch (_) { practiceEntries = []; practiceFields = []; }
    if (renderer) renderer.setTagRegistry(tagRegistry);   // (renderer is lazy; ensureRenderer also seeds it)
    render(); updatePushBtn(); renderVocab();
    renderPractice(); resetPracticeForm();
  })();
</script>
</body>
</html>
