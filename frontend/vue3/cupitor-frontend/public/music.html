<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Sequence Search</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/github-utils.js"></script>
    <script src="/vendor/opensheetmusicdisplay.min.js"></script>
    <script src="/vendor/tone.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 1rem;
        }

        .passing {
            background: #a0d8ef; /* light blue */
            border-radius: 3px;
            padding: 0 2px;
        }

        .text-xl {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .font-bold {
            font-weight: bold;
        }

        .bg-blue-600 {
            background-color: #2563eb;
        }

        .text-white {
            color: #fff;
        }

        .px-3 {
            padding-left: .75rem;
            padding-right: .75rem;
        }

        .py-1 {
            padding-top: .25rem;
            padding-bottom: .25rem;
        }

        .rounded {
            border-radius: .5rem;
        }

        .mt-4 {
            margin-top: 1rem;
        }

        .text-green-600 {
            color: #16a34a;
        }

        .text-red-600 {
            color: #dc2626;
        }

        .font-semibold {
            font-weight: 600;
        }

        .highlight {
            background: yellow;
            border-radius: 3px;
            padding: 0 2px;
        }

        .accordion {
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .accordion summary {
            cursor: pointer;
            padding: 6px;
            font-weight: bold;
        }

        .accordion pre {
            white-space: pre-wrap;
            margin: 0;
            padding: 6px;
        }

        .controls {
            margin-bottom: 1em;
        }

        .accordion-container {
            width: 100%;
            font-family: system-ui, sans-serif;
        }

        .accordion-header {
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            background: #f3f3f3;
            border: none;
            outline: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.25s, color 0.25s;
        }

        .accordion-header:hover {
            background: #e6e6e6;
        }

        .accordion-header.active {
            background: #ccc;
            color: #222;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            background: #fafafa;
            border: 1px solid #ddd;
            border-top: none;
            padding: 0 16px;
        }

        .accordion-content.open {
            padding: 10px 16px;
            max-height: 100%; /* or adjust as needed */
        }

        #appLayout { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; }
        #searchView { flex: 1 1 320px; min-width: 280px; }
        #musicPreview { flex: 2 1 460px; min-width: 280px; }
        #results .resultRow { padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; margin: 4px 0; cursor: pointer; }
        #results .resultRow:hover { background: #f3f3f3; }
        .chordChip { display: inline-flex; gap: 4px; align-items: center; border: 1px solid #ccc; border-radius: 6px; padding: 4px 6px; margin: 2px; }
        .extPill { border: 1px solid #bbb; border-radius: 10px; padding: 0 8px; cursor: pointer; background: #fff; }
        .extPill.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        #managerSection { margin-bottom: 1rem; }
        #managerSection > summary { cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
<h2 style="margin:.25rem 0">Music study — <span id="systemLabel"></span></h2>
<details id="managerSection">
  <summary>Manage library (add / rebuild / push pieces)</summary>
  <div class="controls">
    <button id="addXmlBtn">Add MusicXML…</button>
    <input type="file" id="xmlFile" accept=".xml,.musicxml,application/xml,text/xml" style="display:none" multiple>
    <button id="addTextBtn">Add note-text…</button>
    <button id="rebuildBtn">Rebuild &amp; Push selected/new</button>
    <button id="retryBtn" style="display:none"></button>
    <span id="status"></span>
  </div>
  <textarea id="textInput" placeholder="Paste note-text, first line = title" style="display:none;width:100%;height:6em"></textarea>
  <div id="pieceList"></div>
</details>
<div id="appLayout">
  <div id="searchView">
    <div id="searchPanel">
      <div>
        <label><input type="radio" name="searchMode" value="chord" checked> Chord</label>
        <label><input type="radio" name="searchMode" value="melody"> Melody</label>
      </div>
      <div id="chordMode">
        <div id="chips"></div>
        <button id="addChipBtn">+ Add chord</button>
        <div>
          <label><input type="checkbox" id="strictExt"> strict extensions</label>
          <label>max gap <input id="maxGap" type="number" min="0" value="0" style="width:3em"></label>
          <label><input type="checkbox" id="transposeInv"> transpose-invariant</label>
        </div>
      </div>
      <div id="melodyMode" style="display:none">
        <div id="noteButtons"></div>
        <input id="melodyTokens" type="text" placeholder="C . . E G" style="width:16em">
        <div>
          <label><input type="checkbox" id="byInterval"> by interval</label>
          <label>tolerance <input id="pitchTol" type="number" min="0" value="0" style="width:3em"></label>
        </div>
      </div>
      <div>
        <label>max results <input id="maxResults" type="number" min="1" value="20" style="width:4em"></label>
        <button id="searchBtn">Search</button>
        <span id="searchMsg"></span>
      </div>
    </div>
    <div id="results"></div>
    <details id="vocabSection" style="margin-top:1rem">
      <summary style="cursor:pointer;font-weight:600">Vocabulary</summary>
      <div id="vocabList"></div>
    </details>
  </div>
<div id="musicPreview" style="display:none;border-top:1px solid #ddd;padding-top:1rem">
  <div style="margin-bottom:.5rem">
    <strong id="previewTitle"></strong>
    <button id="previewFullBtn">Full</button>
    <label>Measures:
      <input id="segFrom" type="number" min="1" style="width:4em" placeholder="from">–
      <input id="segTo" type="number" min="1" style="width:4em" placeholder="to">
    </label>
    <button id="previewSegBtn">Show segment</button>
    <button id="segPrevBtn" title="show one fewer measure">◀ Prev</button>
    <button id="segNextBtn" title="show one more measure">Next ▶</button>
    <button id="previewCloseBtn">Close</button>
    <span id="previewMsg"></span>
  </div>
  <div id="transport" style="margin:.5rem 0">
    <select id="srcSel"><option value="midi">MIDI</option><option value="youtube">YouTube</option></select>
    <button id="playBtn">▶ Play</button>
    <button id="pauseBtn">⏸ Pause</button>
    <button id="stopBtn">⏹ Stop</button>
    <label><input type="checkbox" id="loopChk"> Loop segment</label>
    <label>Tempo <input id="tempoInput" type="number" min="20" max="300" style="width:4em"></label>
    <label>Instrument
      <select id="instrSel">
        <option value="piano">Piano</option>
        <option value="guitar">Guitar</option>
        <option value="strings">Strings</option>
        <option value="organ">Organ</option>
        <option value="synth">Synth</option>
      </select>
    </label>
    <span id="transportMsg"></span>
  </div>
  <div id="mediaRow" style="margin:.25rem 0">
    <input id="ytUrl" type="text" placeholder="YouTube URL" style="width:18em">
    <button id="ytSaveBtn">Link YouTube</button>
    <button id="guessBtn">Guess segment times</button>
    <input id="guessSec" type="number" step="0.1" style="width:5em" placeholder="start s">
    <input id="guessEndSec" type="number" step="0.1" style="width:5em" placeholder="end s">
    <input id="vocabCat" type="text" placeholder="category" style="width:8em">
    <button id="addVocabBtn">Add to vocab</button>
    <span id="mediaMsg"></span>
  </div>
  <div id="viewOptions" style="margin:.25rem 0">
    <label><input type="checkbox" id="voiceColorChk"> Color voices</label>
    <label><input type="checkbox" id="noteNameChk"> Note names</label>
    <label><input type="checkbox" id="chordChk"> Show chords</label>
  </div>
  <div id="chordChips" style="margin:.25rem 0"></div>
  <div id="osmdPreview"></div>
  <div id="ytPlayer" style="display:none"></div>
</div>
</div>

<script type="module">
  import { getSystemFromUrl, getMusicResourceUrl, loadLibrary, rebuildAndPush, retryPush } from './music-index.js';
  import { runQuery } from './music-query.js';
  import { createMusicRenderer, resolveMatchMeasures } from './music-render.js';
  import { buildChordQuery, buildMelodyQuery, matchSummary } from './music-search-ui.js';
  import { createMusicStore } from './music-local-store.js';
  import { buildSchedule, buildScheduleFromMusicXml, createMusicPlayer, createYouTubeController, parseYouTubeId, instrumentVoiceKey } from './music-player.js';
  import { guessSegmentStart, linkYouTubeAndPush } from './music-media.js';
  import { buildSnapshot, buildVocabEntry, upsertVocab, loadVocab, saveVocabAndPush, groupVocabByCategory } from './music-vocab.js';

  const system = getSystemFromUrl().name;
  document.getElementById('systemLabel').textContent = system;

  // jQuery is already global in music.html (loaded via <script>); musicxml.js needs it.
  let index = [];
  let unpushedIds = new Set();
  let vocab = [];
  const store = createMusicStore();
  const pending = [];  // newly added pieces not yet pushed: {id,title,format,source,key}

  function idFromName(name) {
    return name.replace(/\.(xml|musicxml|txt)$/i, '').trim().replace(/\s+/g, '_').replace(/[\/\\:*?"<>|]/g, '');
  }
  function setStatus(s) { document.getElementById('status').textContent = s; }

  function updateRetryBtn() {
    const btn = document.getElementById('retryBtn');
    if (unpushedIds.size) { btn.style.display = ''; btn.textContent = `Retry push (${unpushedIds.size})`; }
    else { btn.style.display = 'none'; }
  }

  function makeCommitter(label) {
    return (files) => window.GitHubUtils.commitMultipleFiles({
      owner: 'trexsatya', repo: 'trexsatya.github.io', branch: 'gh-pages',
      commitMessage: `music(${system}): rebuild ${label}`, files
    });
  }

  function render() {
    const rows = [];
    index.forEach(e => rows.push(
      `<label style="display:block"><input type="checkbox" class="sel" data-id="${e.id}"> ${e.title || e.id} <small>(${e.noteCount} notes, ${e.channels.join('/')})</small> <button class="previewBtn" data-id="${e.id}">Preview</button>${unpushedIds.has(e.id) ? ' <span style="color:#c00;font-weight:600">● not pushed</span>' : ''}</label>`));
    pending.forEach(p => rows.push(
      `<label style="display:block;color:#a06000"><input type="checkbox" class="sel" data-id="${p.id}" checked disabled> ${p.title} <small>(new — will be pushed)</small></label>`));
    document.getElementById('pieceList').innerHTML = rows.join('') || '<em>No pieces yet.</em>';
  }

  document.getElementById('addXmlBtn').onclick = () => document.getElementById('xmlFile').click();
  document.getElementById('xmlFile').onchange = async (ev) => {
    for (const file of ev.target.files) {
      const source = await file.text();
      const id = idFromName(file.name);
      pending.push({ id, title: id, format: 'musicxml', source });
    }
    render();
  };
  document.getElementById('addTextBtn').onclick = () => {
    const ta = document.getElementById('textInput'); ta.style.display = 'block'; ta.focus();
  };
  document.getElementById('textInput').onchange = (ev) => {
    const text = ev.target.value.trim(); if (!text) return;
    const title = text.split('\n')[0].slice(0, 60);
    pending.push({ id: idFromName(title), title, format: 'note-text', source: text, key: 'C' });
    ev.target.value = ''; ev.target.style.display = 'none'; render();
  };

  document.getElementById('rebuildBtn').onclick = async () => {
    const selectedIds = new Set(Array.from(document.querySelectorAll('.sel:checked')).map(c => c.dataset.id));
    const reselected = index
      .filter(e => selectedIds.has(e.id))
      .map(e => ({ id: e.id, title: e.title, format: e.format, source: null, key: e.key }));
    // For already-indexed pieces we need their source; prefer the local store, else fetch the detail file.
    for (const r of reselected) {
      let detail = await store.getDetail(system, r.id).catch(() => null);
      if (!detail) detail = await fetch(`${getMusicResourceUrl(system)}/details/${r.id}.json`).then(x => x.json());
      r.source = detail.source; r.format = detail.format;
    }
    const pieces = [...pending, ...reselected];
    if (!pieces.length) { setStatus('Nothing selected.'); return; }
    setStatus('Saving…');
    const committer = makeCommitter(pieces.map(p => p.id).join(', '));
    try {
      const res = await rebuildAndPush({ system, pieces, currentIndex: index, committer, store,
        force: selectedIds.size > 0, updatedAt: new Date().toISOString().slice(0, 10) });
      index = res.index; pending.length = 0;
      res.changed.forEach(id => { if (res.pushed) unpushedIds.delete(id); else unpushedIds.add(id); });
      render(); updateRetryBtn();
      let msg = res.pushed ? `Pushed: ${res.changed.join(', ')}`
              : (res.changed.length ? `Saved locally; push failed: ${res.pushError}` : 'No changes.');
      if (res.localError) msg += ` (local save error: ${res.localError})`;
      setStatus(msg);
    } catch (e) { setStatus('Error: ' + e.message); }
  };

  document.getElementById('retryBtn').onclick = async () => {
    setStatus('Retrying push…');
    try {
      const res = await retryPush({ system, currentIndex: index, committer: makeCommitter('retry unpushed'), store });
      res.changed.forEach(id => unpushedIds.delete(id));
      render(); updateRetryBtn();
      setStatus(res.pushed ? `Pushed: ${res.changed.join(', ')}`
              : (res.pushError ? 'Retry failed: ' + res.pushError : 'Nothing to retry.'));
    } catch (e) { setStatus('Retry failed: ' + e.message); }
  };

  let renderer = null;
  let totalMeasures = 0;
  function ensureRenderer() {
    if (!renderer) renderer = createMusicRenderer(document.getElementById('osmdPreview'), { onAfterRender: refreshChords });
    return renderer;
  }
  // Rebuild the clickable chord chips against the freshly-rendered measures (called after
  // every render via onAfterRender). Each chip highlights the notes that formed its chord.
  function refreshChords() {
    const box = document.getElementById('chordChips');
    if (!box) return;
    box.textContent = '';
    if (!renderer || !document.getElementById('chordChk').checked) { if (renderer) renderer.clearHighlight(); return; }
    renderer.getGuessedChords().forEach((ch) => {
      const b = document.createElement('button');
      b.textContent = `m${ch.measure}: ${ch.name}`;
      b.style.cssText = 'margin:2px;padding:2px 6px;cursor:pointer;border:1px solid #ccc;border-radius:6px;background:#fff';
      b.onclick = () => renderer.highlightChord(ch.notes);
      box.appendChild(b);
    });
  }

  let player = null, yt = null, currentDetail = null;
  function ensurePlayer() {
    if (!player) player = createMusicPlayer({ getCursor: () => (renderer && renderer.osmd ? renderer.osmd.cursor : null) });
    return player;
  }
  function segmentRange() {
    const from = parseInt(document.getElementById('segFrom').value, 10);
    const to = parseInt(document.getElementById('segTo').value, 10);
    return (Number.isFinite(from) && Number.isFinite(to)) ? { fromMeasure: from, toMeasure: to } : {};
  }
  function currentTempo() {
    const t = parseInt(document.getElementById('tempoInput').value, 10);
    return Number.isFinite(t) && t > 0 ? t : 90;
  }
  function playMidi() {
    if (!currentDetail) return;
    // MusicXML pieces get a time-accurate, polyphonic schedule from the source; note-text
    // pieces (no real timing) fall back to the simple per-note sequential builder.
    const useXml = currentDetail.format === 'musicxml' && currentDetail.source;
    const schedule = useXml
      ? buildScheduleFromMusicXml(currentDetail.source, { tempo: currentTempo(), ...segmentRange() })
      : buildSchedule(currentDetail.voices, { tempo: currentTempo(), ...segmentRange() });
    if (!schedule.length) { document.getElementById('transportMsg').textContent = 'Nothing to play.'; return; }
    const p = ensurePlayer();
    p.setInstrument(document.getElementById('instrSel').value);
    p.setSchedule(schedule);
    p.setLoop(document.getElementById('loopChk').checked);
    document.getElementById('transportMsg').textContent = 'Loading instrument…';
    p.play()
      .then(() => { document.getElementById('transportMsg').textContent = `Playing ${schedule.length} notes`; })
      .catch(() => { document.getElementById('transportMsg').textContent = 'Playback error.'; });
  }
  let ytMonitor = null;
  let ytLoadedId = null;   // video id currently loaded in the player (avoid reloading on replay)
  function clearYtMonitor() { if (ytMonitor) { clearInterval(ytMonitor); ytMonitor = null; } }
  // Bound YouTube playback to [startSec, endSec]: poll currentTime and, on reaching the end,
  // loop back to the start (when Loop is checked) or pause. No-op if the range is degenerate.
  function startYtMonitor(startSec, endSec) {
    clearYtMonitor();
    if (!(endSec > startSec)) return;
    ytMonitor = setInterval(() => {
      if (!yt || !yt.isReady()) return;
      if (yt.getCurrentTime() >= endSec) {
        if (document.getElementById('loopChk').checked) yt.seekTo(startSec);
        else { yt.pause(); clearYtMonitor(); }
      }
    }, 200);
  }
  function playYouTube() {
    const url = currentDetail && currentDetail.meta && currentDetail.meta.youtube;
    const id = parseYouTubeId(url);
    if (!id) { document.getElementById('transportMsg').textContent = 'No linked YouTube video.'; return; }
    document.getElementById('ytPlayer').style.display = '';
    const range = segmentRange();
    const hasSeg = Number.isFinite(range.fromMeasure) && Number.isFinite(range.toMeasure);
    const from = range.fromMeasure || 1, to = range.toMeasure || from;
    const editedStart = parseFloat(document.getElementById('guessSec').value);
    const editedEnd = parseFloat(document.getElementById('guessEndSec').value);
    const startFor = () => {
      if (Number.isFinite(editedStart)) return editedStart;
      const g = guessSegmentStart(currentDetail, [from, to], yt.getDuration());
      document.getElementById('guessSec').value = g.toFixed(1);
      return g;
    };
    const endFor = () => {
      if (Number.isFinite(editedEnd)) return editedEnd;
      const g = guessSegmentStart(currentDetail, [to + 1, to + 1], yt.getDuration());
      document.getElementById('guessEndSec').value = g.toFixed(1);
      return g;
    };
    const begin = () => {
      const s = startFor(); yt.seekTo(s); yt.play();
      if (hasSeg) startYtMonitor(s, endFor()); else clearYtMonitor();
    };
    try {
      if (!yt) {
        // First ever play: build the player; seek+play once it's ready.
        yt = createYouTubeController('ytPlayer', { onReady: () => begin() });
        ytLoadedId = id;
        yt.load(id, Number.isFinite(editedStart) ? editedStart : 0);
      } else if (ytLoadedId !== id) {
        // Switched to a different video: reload it, then seek+play.
        ytLoadedId = id;
        yt.load(id, Number.isFinite(editedStart) ? editedStart : 0);
        begin();
      } else {
        // Same video already loaded: just seek to the segment start + play (no reload —
        // reloading mid-play raced with the immediate seek and restarted from 0).
        begin();
      }
      document.getElementById('transportMsg').textContent = 'Playing YouTube' + (hasSeg ? ' (segment)' : '');
    } catch (e) { document.getElementById('transportMsg').textContent = 'YouTube error: ' + e.message; }
  }
  document.getElementById('instrSel').onchange = () => { if (player) player.setInstrument(document.getElementById('instrSel').value); };
  document.getElementById('playBtn').onclick = () =>
    (document.getElementById('srcSel').value === 'youtube' ? playYouTube() : playMidi());
  document.getElementById('pauseBtn').onclick = () => {
    if (document.getElementById('srcSel').value === 'youtube') { clearYtMonitor(); if (yt) yt.pause(); }
    else if (player) player.pause();
  };
  document.getElementById('stopBtn').onclick = () => {
    if (player) player.stop();
    clearYtMonitor();
    if (yt) yt.pause();
    document.getElementById('transportMsg').textContent = '';
  };
  document.getElementById('segFrom').oninput = () => {
    const f = parseInt(document.getElementById('segFrom').value, 10);   // auto-set end = start + 1
    if (Number.isFinite(f)) document.getElementById('segTo').value = f + 1;
  };

  let currentPreviewId = null;
  document.getElementById('ytSaveBtn').onclick = async () => {
    const url = document.getElementById('ytUrl').value.trim();
    if (!currentPreviewId || !url) { document.getElementById('mediaMsg').textContent = 'Preview a piece and enter a URL.'; return; }
    document.getElementById('mediaMsg').textContent = 'Saving link…';
    const res = await linkYouTubeAndPush({ system, id: currentPreviewId, url, currentIndex: index,
      store, committer: makeCommitter(`link ${currentPreviewId}`) });
    if (res.error) { document.getElementById('mediaMsg').textContent = res.error; return; }
    index = res.index;
    if (currentDetail && currentDetail.meta) currentDetail.meta.youtube = url;
    if (!res.pushed) unpushedIds.add(currentPreviewId); else unpushedIds.delete(currentPreviewId);
    render(); updateRetryBtn();
    document.getElementById('mediaMsg').textContent = res.pushed ? 'Linked + pushed.'
      : `Saved locally; push failed: ${res.pushError}`;
  };
  document.getElementById('guessBtn').onclick = () => {
    if (!currentDetail) { document.getElementById('mediaMsg').textContent = 'Preview a piece first.'; return; }
    const dur = yt && yt.getDuration ? yt.getDuration() : 0;
    if (!dur) { document.getElementById('mediaMsg').textContent = 'Load the YouTube video first (▶ on YouTube source).'; return; }
    const range = segmentRange();
    const from = range.fromMeasure || 1, to = range.toMeasure || from;
    const start = guessSegmentStart(currentDetail, [from, to], dur);
    const end = guessSegmentStart(currentDetail, [to + 1, to + 1], dur);  // start of the next measure
    document.getElementById('guessSec').value = start.toFixed(1);
    document.getElementById('guessEndSec').value = end.toFixed(1);
    document.getElementById('mediaMsg').textContent = `Segment: ${start.toFixed(1)}–${end.toFixed(1)}s of ${dur.toFixed(0)}s`;
  };

  document.getElementById('addVocabBtn').onclick = async () => {
    if (!currentDetail || !currentPreviewId) { document.getElementById('mediaMsg').textContent = 'Preview a piece first.'; return; }
    const range = segmentRange();
    const from = range.fromMeasure || 1, to = range.toMeasure || from;
    const secRaw = parseFloat(document.getElementById('guessSec').value);
    const entry = buildVocabEntry({
      pieceId: currentPreviewId, system, measureRange: [from, to],
      youtube: (currentDetail.meta && currentDetail.meta.youtube) || null,
      startSeconds: Number.isFinite(secRaw) ? secRaw : null,
      snapshot: buildSnapshot(currentDetail, [from, to]),
      category: document.getElementById('vocabCat').value.trim() || 'uncategorized',
      createdAt: new Date().toISOString().slice(0, 10),
    });
    vocab = upsertVocab(vocab, entry);
    renderVocab();
    document.getElementById('mediaMsg').textContent = 'Saving vocab…';
    const res = await saveVocabAndPush({ system, vocab, store, committer: makeCommitter(`vocab ${entry.id}`) });
    document.getElementById('mediaMsg').textContent = res.pushed
      ? `Added "${entry.id}" (${vocab.length} total)`
      : `Saved locally; push failed: ${res.pushError}`;
  };
  async function openPreview(id) {
    const title = (index.find(e => e.id === id) || {}).title || id;
    document.getElementById('previewTitle').textContent = title;
    document.getElementById('previewMsg').textContent = 'Loading…';
    document.getElementById('musicPreview').style.display = 'block';
    currentDetail = null; currentPreviewId = null;   // cleared until a piece fully renders
    let detail;
    try {
      detail = unpushedIds.has(id)
        ? await store.getDetail(system, id)
        : await fetch(`${getMusicResourceUrl(system)}/details/${id}.json`).then(x => x.json());
      if (!detail) throw new Error('detail not found');
    } catch (e) { document.getElementById('previewMsg').textContent = 'Failed to load detail.'; return; }
    let res;
    try {
      res = await ensureRenderer().loadDetail(detail);
    } catch (e) { document.getElementById('previewMsg').textContent = 'Render error: ' + e.message; return; }
    if (!res.ok) { document.getElementById('previewMsg').textContent = 'Cannot render (note-text piece).'; return; }
    currentDetail = detail;
    currentPreviewId = id;
    totalMeasures = res.totalMeasures || 0;
    document.getElementById('instrSel').value = instrumentVoiceKey(detail.meta && detail.meta.instrument);
    if (player) player.setInstrument(document.getElementById('instrSel').value);
    document.getElementById('ytUrl').value = (detail.meta && detail.meta.youtube) || '';
    document.getElementById('guessSec').value = '';
    document.getElementById('tempoInput').value = (detail.meta && detail.meta.tempo) || 90;
    if (player) player.stop();
    renderer.applyResponsiveZoom(document.getElementById('osmdPreview').clientWidth || window.innerWidth);
    renderer.showFull();
    document.getElementById('previewMsg').textContent = `${res.totalMeasures} measures`;
  }
  document.getElementById('pieceList').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.previewBtn');
    if (btn) { ev.preventDefault(); openPreview(btn.dataset.id); }
  });
  document.getElementById('previewFullBtn').onclick = () => renderer && renderer.showFull();
  document.getElementById('voiceColorChk').onchange = (e) => { if (renderer) renderer.setVoiceColors(e.target.checked); };
  document.getElementById('noteNameChk').onchange = (e) => { if (renderer) renderer.setNoteNames(e.target.checked); };
  document.getElementById('chordChk').onchange = () => refreshChords();
  document.getElementById('previewSegBtn').onclick = () => {
    const from = parseInt(document.getElementById('segFrom').value, 10);
    const to = parseInt(document.getElementById('segTo').value, 10);
    if (renderer && Number.isFinite(from) && Number.isFinite(to)) renderer.showSegment([from, to]);
  };
  // Prev/Next extend the shown window: Next adds a measure to the end, Prev removes one.
  function stepSegment(delta) {
    if (!renderer) return;
    let from = parseInt(document.getElementById('segFrom').value, 10);
    let to = parseInt(document.getElementById('segTo').value, 10);
    if (!Number.isFinite(from)) from = 1;
    if (!Number.isFinite(to)) to = from;
    to = Math.max(from, Math.min(totalMeasures || to + 1, to + delta));
    document.getElementById('segFrom').value = from;
    document.getElementById('segTo').value = to;
    renderer.showSegment([from, to]);
  }
  document.getElementById('segNextBtn').onclick = () => stepSegment(1);
  document.getElementById('segPrevBtn').onclick = () => stepSegment(-1);
  document.getElementById('previewCloseBtn').onclick = () => {
    if (player) player.stop();
    document.getElementById('musicPreview').style.display = 'none';
  };

  // ---- Search UI (Layout C) ----
  const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const QUALITIES = ['maj', 'min', 'dim', 'aug'];
  const EXTENSIONS = ['add9', '7', 'maj7', '6', '9', 'sus4'];

  function addChip() {
    const chip = document.createElement('div');
    chip.className = 'chordChip';
    const rootSel = document.createElement('select');
    NOTE_NAMES.forEach(n => rootSel.add(new Option(n, n)));
    const qualSel = document.createElement('select');
    QUALITIES.forEach(q => qualSel.add(new Option(q, q)));
    chip.appendChild(rootSel);
    chip.appendChild(qualSel);
    EXTENSIONS.forEach(ext => {
      const pill = document.createElement('button');
      pill.type = 'button'; pill.className = 'extPill'; pill.textContent = ext; pill.dataset.ext = ext;
      pill.onclick = () => pill.classList.toggle('active');
      chip.appendChild(pill);
    });
    const del = document.createElement('button');
    del.type = 'button'; del.textContent = '×'; del.onclick = () => chip.remove();
    chip.appendChild(del);
    document.getElementById('chips').appendChild(chip);
  }
  function readChips() {
    return Array.from(document.querySelectorAll('#chips .chordChip')).map(chip => {
      const sels = chip.querySelectorAll('select');
      return {
        root: sels[0].value, quality: sels[1].value,
        extensions: Array.from(chip.querySelectorAll('.extPill.active')).map(p => p.dataset.ext),
      };
    });
  }
  function buildNoteButtons() {
    const box = document.getElementById('noteButtons');
    const append = (tok) => { const t = document.getElementById('melodyTokens'); t.value = (t.value ? t.value + ' ' : '') + tok; };
    [...NOTE_NAMES, '.'].forEach(tok => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = tok; b.onclick = () => append(tok);
      box.appendChild(b);
    });
    const clr = document.createElement('button');
    clr.type = 'button'; clr.textContent = 'clear'; clr.onclick = () => { document.getElementById('melodyTokens').value = ''; };
    box.appendChild(clr);
  }
  function currentMode() {
    return document.querySelector('input[name="searchMode"]:checked').value;
  }
  function maxResultsVal() {
    const n = parseInt(document.getElementById('maxResults').value, 10);
    return Number.isFinite(n) && n > 0 ? n : undefined;
  }
  function buildQuery() {
    if (currentMode() === 'chord') {
      return buildChordQuery(readChips(), {
        strict_extensions: document.getElementById('strictExt').checked,
        max_gap: parseInt(document.getElementById('maxGap').value, 10) || 0,
        transpose_invariant: document.getElementById('transposeInv').checked,
        max_results: maxResultsVal(),
      });
    }
    const tokens = document.getElementById('melodyTokens').value.trim().split(/\s+/).filter(Boolean);
    return buildMelodyQuery(tokens, {
      search_by_interval: document.getElementById('byInterval').checked,
      pitch_tolerance: parseInt(document.getElementById('pitchTol').value, 10) || 0,
      max_results: maxResultsVal(),
    });
  }
  function renderResults(results) {
    const box = document.getElementById('results');
    if (!results.length) { box.innerHTML = '<em>No matches.</em>'; return; }
    box.innerHTML = '';
    results.forEach(r => {
      const title = (index.find(e => e.id === r.pieceId) || {}).title || r.pieceId;
      const row = document.createElement('div');
      row.className = 'resultRow';
      row.innerHTML = `<strong>${title}</strong><br><small>${matchSummary(r)}</small>`;
      row.onclick = () => openResult(r);
      box.appendChild(row);
    });
  }
  async function openResult(result) {
    await openPreview(result.pieceId);
    if (!currentDetail) return;   // note-text or failed render: detail pane shows its own message
    const mr = resolveMatchMeasures(currentDetail, result.match);
    if (mr) {
      document.getElementById('segFrom').value = mr[0];
      document.getElementById('segTo').value = mr[1];
      if (renderer) renderer.showSegment(mr);
    }
  }
  async function openVocabEntry(pieceId, from, to) {
    await openPreview(pieceId);
    if (!currentDetail) return;
    document.getElementById('segFrom').value = from;
    document.getElementById('segTo').value = to;
    if (renderer) renderer.showSegment([from, to]);
  }
  function renderVocab() {
    const box = document.getElementById('vocabList');
    const groups = groupVocabByCategory(vocab);
    if (!groups.length) { box.innerHTML = '<em>No vocabulary yet.</em>'; return; }
    box.innerHTML = '';
    groups.forEach(g => {
      const h = document.createElement('div');
      h.innerHTML = `<strong>${g.category}</strong>`;
      box.appendChild(h);
      g.entries.forEach(e => {
        const title = (index.find(x => x.id === e.pieceId) || {}).title || e.pieceId;
        const mark = (e.startSeconds != null || e.youtube) ? ' ▶' : '';
        const row = document.createElement('div');
        row.className = 'resultRow';
        row.innerHTML = `${title} <small>m${e.measureStart}–${e.measureEnd}${mark}</small>`;
        row.onclick = () => openVocabEntry(e.pieceId, e.measureStart, e.measureEnd);
        box.appendChild(row);
      });
    });
  }
  document.querySelectorAll('input[name="searchMode"]').forEach(radio => {
    radio.onchange = () => {
      document.getElementById('chordMode').style.display = currentMode() === 'chord' ? '' : 'none';
      document.getElementById('melodyMode').style.display = currentMode() === 'melody' ? '' : 'none';
    };
  });
  document.getElementById('addChipBtn').onclick = addChip;
  document.getElementById('searchBtn').onclick = () => {
    let query;
    try { query = buildQuery(); } catch (e) { document.getElementById('searchMsg').textContent = e.message; return; }
    let results;
    try { results = runQuery(query, index); }
    catch (e) { document.getElementById('searchMsg').textContent = 'Invalid query: ' + e.message; return; }
    document.getElementById('searchMsg').textContent = `${results.length} match${results.length === 1 ? '' : 'es'}`;
    renderResults(results);
  };
  addChip();            // start with one chord chip
  buildNoteButtons();   // populate the melody note-picker

  (async () => {
    try { const lib = await loadLibrary(system, store); index = lib.index; unpushedIds = lib.unpushedIds; }
    catch (_) { index = []; unpushedIds = new Set(); }
    try { vocab = await loadVocab(system, store); } catch (_) { vocab = []; }
    render(); updateRetryBtn(); renderVocab();
  })();
</script>
</body>
</html>
