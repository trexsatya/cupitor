<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Sequence Search</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/github-utils.js"></script>
    <script src="/vendor/opensheetmusicdisplay.min.js"></script>
    <script src="/vendor/tone.js"></script>
    <link rel="stylesheet" href="/music.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 1rem;
        }

        .passing {
            background: #a0d8ef; /* light blue */
            border-radius: 3px;
            padding: 0 2px;
        }

        .text-xl {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .font-bold {
            font-weight: bold;
        }

        .bg-blue-600 {
            background-color: #2563eb;
        }

        .text-white {
            color: #fff;
        }

        .px-3 {
            padding-left: .75rem;
            padding-right: .75rem;
        }

        .py-1 {
            padding-top: .25rem;
            padding-bottom: .25rem;
        }

        .rounded {
            border-radius: .5rem;
        }

        .mt-4 {
            margin-top: 1rem;
        }

        .text-green-600 {
            color: #16a34a;
        }

        .text-red-600 {
            color: #dc2626;
        }

        .font-semibold {
            font-weight: 600;
        }

        .highlight {
            background: yellow;
            border-radius: 3px;
            padding: 0 2px;
        }

        .accordion {
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .accordion summary {
            cursor: pointer;
            padding: 6px;
            font-weight: bold;
        }

        .accordion pre {
            white-space: pre-wrap;
            margin: 0;
            padding: 6px;
        }

        .controls {
            margin-bottom: 1em;
        }

        .accordion-container {
            width: 100%;
            font-family: system-ui, sans-serif;
        }

        .accordion-header {
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            background: #f3f3f3;
            border: none;
            outline: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.25s, color 0.25s;
        }

        .accordion-header:hover {
            background: #e6e6e6;
        }

        .accordion-header.active {
            background: #ccc;
            color: #222;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            background: #fafafa;
            border: 1px solid #ddd;
            border-top: none;
            padding: 0 16px;
        }

        .accordion-content.open {
            padding: 10px 16px;
            max-height: 100%; /* or adjust as needed */
        }

        #appLayout { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; }
        #searchView { flex: 1 1 320px; min-width: 280px; }
        #musicPreview { flex: 2 1 460px; min-width: 280px; }
        #results .resultRow { padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; margin: 4px 0; cursor: pointer; }
        #results .resultRow:hover { background: #f3f3f3; }
        .chordChip { display: inline-flex; gap: 4px; align-items: center; border: 1px solid #ccc; border-radius: 6px; padding: 4px 6px; margin: 2px; }
        .extPill { border: 1px solid #bbb; border-radius: 10px; padding: 0 8px; cursor: pointer; background: #fff; }
        .extPill.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        #managerSection { margin-bottom: 1rem; }
        #managerSection > summary { cursor: pointer; font-weight: 600; }

        /* Native fullscreen (#previewFullscreenBtn): give the pane a solid background and let it
           scroll, since the fullscreen element otherwise renders on a black, non-scrolling backdrop. */
        #musicPreview:fullscreen { background: #fff; overflow: auto; padding: 1rem; }
        #musicPreview:-webkit-full-screen { background: #fff; overflow: auto; padding: 1rem; }

        /* On phones the inline preview is too cramped; show it as a full-screen modal dialog.
           #musicPreview is toggled via display:none/block, so when shown these rules make it a
           fixed overlay. The existing Close button (#previewCloseBtn) dismisses it. */
        @media (max-width: 700px) {
          #musicPreview {
            position: fixed;
            /* Explicit longhand offsets + sizes, NOT the `inset` shorthand: older mobile Safari
               ignores `inset`, leaving the fixed box to size to its content (taller/wider than the
               screen) while the body is locked — so nothing scrolls and the score is clipped. */
            top: 0; right: 0; bottom: 0; left: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;          /* dynamic viewport: excludes the mobile browser's URL bar */
            box-sizing: border-box;  /* keep the 1rem padding inside the viewport box (no overflow) */
            z-index: 1000;
            margin: 0;
            background: #fff;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
            border-top: none;
            box-shadow: 0 0 24px rgba(0, 0, 0, .4);
          }
          /* The score can be wider than the screen; let it scroll horizontally on its own so the
             page body never has to. */
          #osmdPreview { overflow-x: auto; }
          /* Keep the close/segment controls reachable at the top while scrolling the score. */
          #musicPreview > div:first-child {
            position: sticky;
            top: 0;
            background: #fff;
            padding-bottom: .4rem;
            z-index: 1;
          }
          body.preview-open { overflow: hidden; }   /* lock the page behind the dialog */
        }
        #fretboardPanel.fb-wrap{background:#fff;border:1px solid #d8dee8;border-radius:10px;padding:10px 14px;margin-top:1rem}
        #fretboardPanel summary{cursor:pointer;font-weight:600}
        /* Nested "Controls" collapsible: subtler than the panel's own summary. */
        #fretboardPanel .fb-controls{margin:6px 0}
        #fretboardPanel .fb-controls>summary{font-weight:500;font-size:12.5px;color:#555;list-style:none}
        #fretboardPanel .fb-controls>summary::-webkit-details-marker{display:none}
        #fretboardPanel .fb-controls>summary::before{content:'▸ ';color:#888}
        #fretboardPanel .fb-controls[open]>summary::before{content:'▾ '}
        #fretboardPanel .fb-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;margin:8px 0}
        #fretboardPanel .fb-chip{border:1px solid #1565c0;color:#1565c0;border-radius:999px;padding:2px 10px;cursor:pointer;background:#eef4ff}
        #fretboardPanel .fb-chip.alt{border-color:#bbb;color:#555;background:#fff}
        #fretboardPanel .fb-btn{border:1px solid #1565c0;border-radius:6px;padding:3px 12px;cursor:pointer}
        #fretboardPanel .fb-paths{margin:8px 0;font-size:13px}
        #fretboardPanel .fb-paths select{font:12.5px monospace;padding:4px 8px;border:1px solid #1565c0;border-radius:6px;min-width:320px}
        #fretboardPanel .fb-step{display:flex;gap:8px;align-items:center;font-size:13px;margin:8px 0;flex-wrap:wrap}
        #fretboardPanel .fb-msg{color:#c62828;font-size:12px}
        /* Keep Prev / Step / Next together on one line even when the row wraps. */
        #fretboardPanel .fb-nav{display:inline-flex;gap:8px;align-items:center;flex-wrap:nowrap}
        #fretboardPanel .fb-step-lbl{white-space:nowrap}
        /* Movement arrows: dashes march toward the arrowhead (up = right, down = left); the
           bidirectional arrow pulses instead. Arrowheads pulse for visibility. */
        #fretboardPanel .fb-arrow-line{stroke-dasharray:6 4}
        #fretboardPanel .fb-arrow-line.up{animation:fbFlowFwd .7s linear infinite}
        #fretboardPanel .fb-arrow-line.down{animation:fbFlowBack .7s linear infinite}
        #fretboardPanel .fb-arrow-line.bi{stroke-dasharray:none;animation:fbArrowPulse 1.1s ease-in-out infinite}
        #fretboardPanel .fb-arrowhead{animation:fbArrowPulse 1.1s ease-in-out infinite}
        @keyframes fbFlowFwd{to{stroke-dashoffset:-10}}
        @keyframes fbFlowBack{to{stroke-dashoffset:10}}
        @keyframes fbArrowPulse{0%,100%{opacity:.35}50%{opacity:1}}
        @media (prefers-reduced-motion: reduce){
          #fretboardPanel .fb-arrow-line,#fretboardPanel .fb-arrowhead{animation:none}
        }
        #fbSvg{max-width:100%;overflow-x:auto;display:block}
        /* Collapsible Motifs / Phrases panels (like the fretboard panel) + shared match bar. */
        .np-panel{margin:.25rem 0;padding:.4rem .6rem;border-radius:4px}
        .np-panel>summary{cursor:pointer;font-weight:600;font-size:13.5px}
        /* Header toggle: shows/hides THIS panel's tags/phrases on the sheet (dim the rest), independent
           of expand/collapse (which only shows the panel's own controls + list). */
        .np-vis{margin-left:8px;border:1px solid #bbb;background:#fff;border-radius:6px;padding:1px 7px;cursor:pointer;font-size:12.5px;font-weight:400;vertical-align:middle}
        .np-vis[aria-pressed="true"]{background:#1565c0;border-color:#1565c0;color:#fff}
        #tagPanel{background:#f6f3ff;border:1px solid #ddd0ff}
        #phrasePanel{background:#eef4ff;border:1px solid #cfe0ff}
        /* When expanded, a panel's body floats over the sheet (absolute) instead of pushing it down —
           so toggling a panel never reflows the page (which could nudge a scrollbar and force OSMD to
           re-render, dropping the pattern-match highlights). Anchored below both summaries via .np-wrap. */
        .np-wrap{position:relative}
        .np-panel[open]>.np-body{position:absolute;left:0;right:0;top:100%;z-index:60;margin-top:3px;
          border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:.5rem .7rem;max-height:72vh;overflow:auto}
        #tagPanel[open]>.np-body{background:#f6f3ff;border:1px solid #ddd0ff}
        #phrasePanel[open]>.np-body{background:#eef4ff;border:1px solid #cfe0ff}
        .pattern-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin:.25rem 0;padding:.35rem .6rem;background:#fafafa;border:1px solid #e5e5e5;border-radius:4px}
        .pattern-controls select{padding:3px 6px;border:1px solid #ccc;border-radius:5px;font-size:13px}
        /* Pattern tags */
        #tagPanel .tag-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
        #tagPanel .tag-lbl{color:#555}
        #tagPanel select,#tagPanel #tagNew{padding:3px 6px;border:1px solid #c9b8ff;border-radius:5px;font-size:13px}
        #tagPanel .tag-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
        #tagPanel .tag-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #ddd0ff;border-radius:999px;padding:3px 8px;font-size:12.5px;background:#fff}
        #tagPanel .tag-pill .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
        #tagPanel .tag-pill .cnt{color:#888}
        #tagPanel .tag-pill .del{border:none;background:none;color:#a33;cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
        /* Check/uncheck-all sits just before the tag pills. */
        #tagPanel .tag-list-head{display:flex;align-items:flex-start;gap:8px;margin-top:8px}
        #tagPanel .tag-list-head .tag-list{margin-top:0}
        #tagPanel .icon-btn{border:1px solid #bbb;background:#fff;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:15px;line-height:1.5;flex:none}
        /* Phrases panel: one card per phrase (header row of actions + a wrap of member-tag checkboxes). */
        #phrasePanel .tag-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
        #phrasePanel .tag-lbl{color:#555}
        #phrasePanel .tag-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
        #phrasePanel .phrase-row{border:1px solid #cfe0ff;border-radius:6px;padding:6px 8px;background:#fff}
        #phrasePanel .phrase-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
        #phrasePanel .phrase-tags{display:flex;flex-wrap:wrap;margin-top:6px;padding-top:6px;border-top:1px dashed #e0e8f5}
        #phrasePanel .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
        #phrasePanel .del{border:none;background:none;color:#a33;cursor:pointer;font-size:15px;line-height:1;padding:0 2px;margin-left:auto}
        #phrasePanel .btn.active{background:#1565c0;color:#fff;border-color:#1565c0}
        #fretboardPanel:fullscreen{background:#fff;overflow:auto;padding:24px}
        #fretboardPanel:fullscreen #fbSvg{width:100%;height:auto;max-width:none}
        /* Touch-friendly chord-window move/resize buttons (alternative to dragging) */
        #windowNudge.win-nudge{display:inline-flex;gap:6px;align-items:center;margin-right:.5em;vertical-align:middle}
        #windowNudge .win-btn{min-width:40px;height:36px;border:1px solid #1565c0;background:#eef4ff;color:#1565c0;border-radius:6px;font-size:16px;line-height:1;cursor:pointer;font-weight:700}
        #windowNudge .win-btn:active{background:#1565c0;color:#fff}
        #windowNudge .win-sep{display:inline-block;width:1px;height:22px;background:#cfe0ff}
        /* Fretboard panel — mobile layout: bigger touch targets, full-width select, stacked controls */
        @media (max-width:640px){
          #fretboardPanel.fb-wrap{padding:8px 10px}
          /* Smaller, tidier tap targets (the old 40px min-height looked clunky). */
          #fretboardPanel .fb-btn,#fretboardPanel .fb-chip{padding:4px 9px;font-size:12px}
          #fretboardPanel .fb-bar .fb-btn{margin-left:0 !important}
          #fretboardPanel .fb-paths select{width:100%;min-width:0}
          #fretboardPanel .fb-bar,#fretboardPanel .fb-step{gap:6px}
          #fbSpeed{flex:1 1 120px}
          #windowNudge .win-btn{min-width:48px;height:42px;font-size:18px}
        }
    </style>
</head>
<body>
<h2 style="margin:.25rem 0">Music study — <span id="systemLabel"></span></h2>
<details id="managerSection">
  <summary>Manage library (add / rebuild / push pieces)</summary>
  <div class="controls">
    <button id="addXmlBtn">Add MusicXML…</button>
    <input type="file" id="xmlFile" accept=".xml,.musicxml,application/xml,text/xml" style="display:none" multiple>
    <button id="addTextBtn">Add note-text…</button>
    <button id="rebuildBtn">Rebuild selected/new (local)</button>
    <button id="retryBtn" style="display:none"></button>
    <span id="status"></span>
  </div>
  <textarea id="textInput" placeholder="Paste note-text, first line = title" style="display:none;width:100%;height:6em"></textarea>
  <div id="tagFilterBar" style="margin:.35rem 0"></div>
  <div id="pieceList"></div>
</details>
<div id="appLayout">
  <div id="searchView">
    <div id="searchPanel">
      <div>
        <label><input type="radio" name="searchMode" value="chord" checked> Chord</label>
        <label><input type="radio" name="searchMode" value="melody"> Melody</label>
      </div>
      <div id="chordMode">
        <div id="chips"></div>
        <button id="addChipBtn">+ Add chord</button>
        <div>
          <button class="btn toggle" data-for="strictExt" title="Require exact chord extensions (no extra tones)"><span class="ic">🎯</span><span class="txt">strict extensions</span></button>
          <label>max gap <input id="maxGap" type="number" min="0" value="0" style="width:3em"></label>
          <button class="btn toggle" data-for="transposeInv" title="Match the progression in any key"><span class="ic">🔀</span><span class="txt">transpose-invariant</span></button>
          <input type="checkbox" id="strictExt" hidden>
          <input type="checkbox" id="transposeInv" hidden>
        </div>
      </div>
      <div id="melodyMode" style="display:none">
        <div id="noteButtons"></div>
        <input id="melodyTokens" type="text" placeholder="C . . E G" style="width:16em">
        <div>
          <label><input type="checkbox" id="byInterval"> by interval</label>
          <label>tolerance <input id="pitchTol" type="number" min="0" value="0" style="width:3em"></label>
        </div>
      </div>
      <div>
        <label>max results <input id="maxResults" type="number" min="1" value="20" style="width:4em"></label>
        <button id="searchBtn">Search</button>
        <span id="searchMsg"></span>
      </div>
    </div>
    <div id="results"></div>
    <details id="vocabSection" style="margin-top:1rem">
      <summary style="cursor:pointer;font-weight:600">Vocabulary</summary>
      <div id="vocabList"></div>
    </details>
  </div>
<div id="musicPreview" style="display:none;border-top:1px solid #ddd;padding-top:1rem">
  <div style="margin-bottom:.5rem" class="previewControls">
    <div><strong id="previewTitle"></strong></div>
    <label class="measLabel">Measures:
      <button id="startPrevBtn" class="btn ico" title="extend the window to an earlier measure">◀</button>
      <input id="segFrom" type="number" min="1" style="width:2.4em" placeholder="from">
      <button id="startNextBtn" class="btn ico" title="move the start later">▶</button>
      –
      <button id="endPrevBtn" class="btn ico" title="move the end earlier">◀</button>
      <input id="segTo" type="number" min="1" style="width:2.4em" placeholder="to">
      <button id="endNextBtn" class="btn ico" title="extend the window to a later measure">▶</button>
    </label>
    <button id="previewFullBtn" class="btn" title="Show the full piece"><span class="ic">⤢</span><span class="txt">Full</span></button>
    <button id="previewSegBtn" class="btn" title="Show this measure range"><span class="ic">◧</span><span class="txt">Show segment</span></button>
    <button id="previewFullscreenBtn" class="btn" title="Toggle fullscreen"><span class="ic">⛶</span><span class="txt">Fullscreen</span></button>
    <button id="previewCloseBtn" class="btn" title="Close"><span class="ic">✕</span><span class="txt">Close</span></button>
    <span id="previewMsg"></span>
  </div>
  <div id="transport" style="margin:.5rem 0" class="previewControls">
    <select id="srcSel"><option value="midi">MIDI</option><option value="youtube">YouTube</option></select>
    <button id="playBtn" class="btn" title="Play from the start"><span class="ic">▶</span><span class="txt">▶ Play</span></button>
    <button id="pauseBtn" class="btn" title="Pause / Resume"><span class="ic">⏸</span><span class="txt">⏸ Pause</span></button>
    <button class="btn toggle" data-for="loopChk" title="Loop the segment" aria-pressed="false"><span class="ic">🔁</span><span class="txt">🔁 Loop segment</span></button>
    <input type="checkbox" id="loopChk" hidden>   <!-- loop state; toggled by the button above -->

    <label>Tempo <input id="tempoInput" type="number" min="20" max="300" style="width:4em"></label>
    <label>Instrument
      <select id="instrSel">
        <option value="piano">Piano</option>
        <option value="guitar">Guitar</option>
        <option value="strings">Strings</option>
        <option value="organ">Organ</option>
        <option value="synth">Synth</option>
      </select>
    </label>
    <span id="transportMsg" style="color: blueviolet;"></span>
  </div>
  <div id="mediaRow" style="margin:.25rem 0" class="previewControls">
    <button id="ytToggleBtn" class="btn" title="Show / hide the YouTube link field"><span class="ic">🔗</span><span class="txt">🔗 YouTube link</span></button>
    <span id="ytLinkWrap" style="display:none">
      <input id="ytUrl" type="text" placeholder="YouTube URL" style="width:16em">
      <button id="ytSaveBtn" class="btn" title="Link this YouTube video to the piece"><span class="ic">💾</span><span class="txt">Link</span></button>
    </span>
    <button id="guessBtn" class="btn" title="Guess segment start/end times from the YouTube video"><span class="ic">⏱</span><span class="txt">Guess times</span></button>
    <input id="guessSec" type="number" step="0.1" style="width:5em" placeholder="start s">
    <input id="guessEndSec" type="number" step="0.1" style="width:5em" placeholder="end s">
    <input id="vocabCat" type="text" placeholder="category" style="width:8em">
    <input id="vocabNote" type="text" placeholder="note" style="width:14em">
    <button id="addVocabBtn" class="btn"><span class="ic">➕</span><span class="txt">Add to vocab</span></button>
  </div>
  <div id="viewOptions" style="margin:.25rem 0" class="previewControls">
    <button class="btn toggle" data-for="voiceColorChk" title="Color the voices"><span class="ic">🎨</span><span class="txt">Color voices</span></button>
    <button class="btn toggle" data-for="noteNameChk" title="Show note names"><span class="ic">🔤</span><span class="txt">Note names</span></button>
    <button class="btn toggle" data-for="chordChk" title="Show chords"><span class="ic">🎵</span><span class="txt">Show chords</span></button>
    <button class="btn toggle" data-for="dimConnChk" title="Dim beams / stems"><span class="ic">〰️</span><span class="txt">Dim beams/stems</span></button>
    <button class="btn toggle" data-for="chordWindowChk" title="Draggable chord window"><span class="ic">🔲</span><span class="txt">Chord window</span></button>
    <button class="btn toggle" data-for="globalMatchChk" title="When on, clicking a chord name highlights every occurrence of it across the visible sheet"><span class="ic">🌐</span><span class="txt">Global</span></button>
    <input type="checkbox" id="voiceColorChk" checked hidden>
    <input type="checkbox" id="noteNameChk" hidden>
    <input type="checkbox" id="chordChk" checked hidden>
    <input type="checkbox" id="dimConnChk" checked hidden>
    <input type="checkbox" id="chordWindowChk" hidden>
    <input type="checkbox" id="globalMatchChk" hidden>
  </div>
  <div id="suppressPanel" style="display:none; margin:.25rem 0; padding:.3rem .4rem; background:#fff8f0; border:1px solid #ffd9b0; border-radius:4px">
    <button class="btn toggle" data-for="suppressModeChk" title="Click notes to silence them"><span class="ic">🔇</span><span class="txt">Suppress notes</span></button>
    <button class="btn toggle" data-for="hearAllChk" title="Temporarily hear every suppressed note"><span class="ic">👂</span><span class="txt">Hear all</span></button>
    <span id="voiceChips"></span>
    <span id="suppressHint" style="font-size:.8em;color:#a0660a"></span>
    <input type="checkbox" id="suppressModeChk" hidden>
    <input type="checkbox" id="hearAllChk" hidden>
  </div>
  <div id="windowPanel" style="display:none; margin:.25rem 0; padding:.3rem .4rem; background:#f4f8ff; border:1px solid #cfe0ff; border-radius:4px">
    <div id="windowNudge" class="win-nudge" title="Move / resize the window (easier than dragging on touch)">
      <button type="button" id="winMoveL" class="win-btn" title="Move window left" aria-label="Move window left">◀</button>
      <button type="button" id="winMoveR" class="win-btn" title="Move window right" aria-label="Move window right">▶</button>
      <button type="button" id="winMoveU" class="win-btn" title="Move window to line above" aria-label="Move window up">▲</button>
      <button type="button" id="winMoveD" class="win-btn" title="Move window to line below" aria-label="Move window down">▼</button>
      <span class="win-sep"></span>
      <button type="button" id="winShrink" class="win-btn" title="Shrink window" aria-label="Shrink window">–</button>
      <button type="button" id="winExpand" class="win-btn" title="Expand window" aria-label="Expand window">+</button>
    </div>
    <span style="font-size:.85em;color:#555">Chords:</span>
    <span id="windowChords"></span>
    <span id="windowRange" style="font-size:.8em;color:#777"></span>

  <div class="np-wrap">

        <input id="tagInput" list="tagOptions" placeholder="pick or type a tag…" maxlength="24" autocomplete="off"
               title="Pick an existing tag or type a new one (Enter), then click notes to paint it" style="width:11em">

      <label class="tag-lbl" title="Silence inserted between tagged runs, in beats (scales with tempo)">Breath
        <input type="number" id="breathBeats" min="0" max="4" step="0.25" value="1" style="width:2em">

          <button type="button" id="fbShapePrev" class="fb-chip">◀</button>

      <button type="button" id="fbPlayStep" class="fb-btn" title="Sound the current step's notes (the highlighted sheet segment)">🔊 Play step</button>
      <button type="button" id="fbNext" class="fb-btn">Next ▶</button>
      <button type="button" class="btn toggle" data-for="fbAutoPlayChk" title="Automatically sound each step as you move Prev/Next"><span class="ic">🎧</span><span class="txt">Auto-play</span></button>
      <button type="button" class="btn toggle" data-for="fbNoteName" title="Label the dots with note names (off = fret numbers)"><span class="ic">🔤</span><span class="txt">Note names</span></button>

<script type="module">
  import { getSystemFromUrl, getMusicResourceUrl, loadLibrary, computeChanges, pushPending, filterByTags, removePieceFromLibrary } from './music-index.js';
  import { runQuery } from './music-query.js';
  import { createMusicRenderer, resolveMatchMeasures } from './music-render.js';
  import { init as initFretboard } from './fretboard-panel.js';
  import { chordDisplayName } from './music-chords.js';
  import { buildChordQuery, buildMelodyQuery, matchSummary } from './music-search-ui.js';
  import { createMusicStore } from './music-local-store.js';
  import { buildSchedule, buildScheduleFromMusicXml, createMusicPlayer, createYouTubeController, parseYouTubeId, instrumentVoiceKey } from './music-player.js';
  import { guessSegmentStart, linkYouTubeLocal } from './music-media.js';
  import { buildSnapshot, buildVocabEntry, upsertVocab, uniqueVocabId, loadVocab, groupVocabByCategory } from './music-vocab.js';
  import { addTag as addTagReg, removeTag as removeTagReg, mergeRegistry } from './music-tags.js';

  const system = getSystemFromUrl().name;
  document.getElementById('systemLabel').textContent = system;

  // jQuery is already global in music.html (loaded via <script>); musicxml.js needs it.
  let index = [];
  let unpushedIds = new Set();   // pieces with local index/detail edits (add/rebuild/tags/link) awaiting push
  let vocab = [];
  let dirtyVocab = false;        // vocab.json changed locally, awaiting the manual push
  let dirtyIndex = false;        // index.json changed with no unpushed piece (e.g. a delete) — needs push
  const tagFilter = new Set();   // active tag filter; applies to the library list AND search
  const store = createMusicStore();
  const pending = [];  // newly added pieces not yet pushed: {id,title,format,source,key}

  // Pattern-tag registry: the GLOBAL list of tags [{name,color}], shared across all pieces and
  // synced via a pushed tags.json (like vocab.json). Per-piece note assignments live in each
  // detail.patterns. Loaded at startup; edits persist locally and go out in the next manual push.
  let tagRegistry = [];
  let dirtyTags = false;   // tags.json changed locally, awaiting the manual push
  async function loadTagRegistry() {
    let remote = [];
    try { const res = await fetch(`${getMusicResourceUrl(system)}/tags.json`); if (res.ok) remote = await res.json(); } catch (_) { remote = []; }
    let local = [];
    try { local = (await store.getTags(system)) || []; } catch (_) { local = []; }
    return mergeRegistry(remote, local);   // remote ∪ local-only tags, colors preserved
  }
  function saveTagRegistry() {
    store.putTags(system, tagRegistry).catch(() => {});
    dirtyTags = true;
    if (renderer) renderer.setTagRegistry(tagRegistry);
    updatePushBtn();
  }

  function idFromName(name) {
    return name.replace(/\.(xml|musicxml|txt)$/i, '').trim().replace(/\s+/g, '_').replace(/[\/\\:*?"<>|]/g, '');
  }
  function setStatus(s) { document.getElementById('status').textContent = s; }

  // The single manual-push affordance: every edit stacks up locally; this button (was "Retry push")
  // commits them all in one batch. Count = unpushed pieces + a vocab change + an index-only change.
  function updatePushBtn() {
    const btn = document.getElementById('retryBtn');
    const n = unpushedIds.size + (dirtyVocab ? 1 : 0) + (dirtyIndex ? 1 : 0) + (dirtyTags ? 1 : 0);
    if (n > 0) { btn.style.display = ''; btn.textContent = `Push changes (${n})`; }
    else { btn.style.display = 'none'; }
  }
  function hasPending() { return unpushedIds.size > 0 || dirtyVocab || dirtyIndex || dirtyTags; }

  function makeCommitter(label) {
    return (files) => window.GitHubUtils.commitMultipleFiles({
      owner: 'trexsatya', repo: 'trexsatya.github.io', branch: 'gh-pages',
      commitMessage: `music(${system}): rebuild ${label}`, files
    });
  }

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
  // Parse a comma-separated tag string → trimmed, de-duped, non-empty list (order preserved).
  function parseTags(str) {
    const out = [];
    String(str || '').split(',').forEach(t => { const v = t.trim(); if (v && !out.includes(v)) out.push(v); });
    return out;
  }
  function allTags() {
    const set = new Set();
    index.forEach(e => (e.tags || []).forEach(t => set.add(t)));
    return [...set].sort();
  }
  // Tag-filter chips above the library list; clicking a chip toggles it in the active filter.
  function renderTagFilter() {
    const bar = document.getElementById('tagFilterBar');
    const tags = allTags();
    if (!tags.length) { bar.innerHTML = ''; return; }
    bar.innerHTML = '<span style="font-size:.8em;color:#555">Filter by tag:</span> '
      + tags.map(t => `<button class="tagChip${tagFilter.has(t) ? ' active' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`).join(' ')
      + (tagFilter.size ? ` <button class="tagChip" data-tag="" title="Clear filter">clear ✕</button>` : '');
  }
  function render() {
    const rows = [];
    filterByTags(index, tagFilter).forEach(e => rows.push(
      `<label style="display:block"><input type="checkbox" class="sel" data-id="${e.id}"> ${esc(e.title || e.id)} <small>(${e.noteCount} notes, ${e.channels.join('/')})</small> `
      + `<button class="previewBtn" data-id="${e.id}">Preview</button> `
      + `<input class="pieceTags" data-id="${e.id}" value="${esc((e.tags || []).join(', '))}" placeholder="tags…" style="width:10em;font-size:.85em"> `
      + `<button class="pieceDel" data-id="${e.id}" title="Delete piece + its vocab">🗑</button>`
      + `${unpushedIds.has(e.id) ? ' <span style="color:#c00;font-weight:600">● not pushed</span>' : ''}</label>`));
    pending.forEach(p => rows.push(
      `<label style="display:block;color:#a06000"><input type="checkbox" class="sel" data-id="${p.id}" checked disabled> ${esc(p.title)} <small>(new — Push to publish)</small></label>`));
    document.getElementById('pieceList').innerHTML = rows.join('') || '<em>No pieces match.</em>';
    renderTagFilter();
  }

  document.getElementById('addXmlBtn').onclick = () => document.getElementById('xmlFile').click();
  document.getElementById('xmlFile').onchange = async (ev) => {
    for (const file of ev.target.files) {
      const source = await file.text();
      const id = idFromName(file.name);
      pending.push({ id, title: id, format: 'musicxml', source });
    }
    render();
  };
  document.getElementById('addTextBtn').onclick = () => {
    const ta = document.getElementById('textInput'); ta.style.display = 'block'; ta.focus();
  };
  document.getElementById('textInput').onchange = (ev) => {
    const text = ev.target.value.trim(); if (!text) return;
    const title = text.split('\n')[0].slice(0, 60);
    pending.push({ id: idFromName(title), title, format: 'note-text', source: text, key: 'C' });
    ev.target.value = ''; ev.target.style.display = 'none'; render();
  };

  document.getElementById('rebuildBtn').onclick = async () => {
    const selectedIds = new Set(Array.from(document.querySelectorAll('.sel:checked')).map(c => c.dataset.id));
    const reselected = index
      .filter(e => selectedIds.has(e.id))
      .map(e => ({ id: e.id, title: e.title, format: e.format, source: null, key: e.key }));
    // For already-indexed pieces we need their source; prefer the local store, else fetch the detail file.
    for (const r of reselected) {
      let detail = await store.getDetail(system, r.id).catch(() => null);
      if (!detail) detail = await fetch(`${getMusicResourceUrl(system)}/details/${r.id}.json`).then(x => x.json());
      r.source = detail.source; r.format = detail.format;
    }
    const pieces = [...pending, ...reselected];
    if (!pieces.length) { setStatus('Nothing selected.'); return; }
    setStatus('Encoding…');
    try {
      const { changed, changedPieces, index: nextIndex } = computeChanges({ system, pieces, currentIndex: index,
        force: selectedIds.size > 0, updatedAt: new Date().toISOString().slice(0, 10) });
      index = nextIndex; pending.length = 0;
      let localError = null;
      try { await store.putPieces(system, changedPieces); } catch (e) { localError = e.message; }
      changed.forEach(id => unpushedIds.add(id));
      render(); updatePushBtn();
      setStatus(changed.length
        ? `Encoded ${changed.length} piece(s) locally — click "Push changes" to publish.${localError ? ' (local save error: ' + localError + ')' : ''}`
        : 'No changes.');
    } catch (e) { setStatus('Error: ' + e.message); }
  };

  // Manual push: commit ALL stacked local edits (index + changed details + vocab) in one batch.
  document.getElementById('retryBtn').onclick = async () => {
    if (!hasPending()) { setStatus('Nothing to push.'); return; }
    setStatus('Pushing…');
    try {
      const res = await pushPending({ system, currentIndex: index, vocab, pushVocab: dirtyVocab,
        tags: tagRegistry, pushTags: dirtyTags, committer: makeCommitter('push changes'), store });
      if (res.pushed) { unpushedIds.clear(); dirtyVocab = false; dirtyIndex = false; dirtyTags = false; }
      render(); updatePushBtn();
      setStatus(res.pushed ? 'Pushed all changes to GitHub.' : 'Push failed: ' + (res.pushError || 'unknown'));
    } catch (e) { setStatus('Push failed: ' + e.message); }
  };

  let renderer = null;
  let totalMeasures = 0;
  // Measure numbers are stored/rendered SEQUENTIALLY (pickup = 1) but shown/typed as the score's
  // PRINTED numbers. currentOffset = sequential − printed for the loaded piece (the pickup shift).
  let currentOffset = 0;
  const toPrintedMeasure = (seq) => (Number.isFinite(seq) ? seq - currentOffset : seq);
  const toSeqMeasure = (printed) => (Number.isFinite(printed) ? printed + currentOffset : printed);
  function ensureRenderer() {
    if (!renderer) {
      renderer = createMusicRenderer(document.getElementById('osmdPreview'),
        { onChordSelect: syncVocabChords, onWindowChange: onChordWindowChange, onSuppressionChange: onSuppressionChange,
          onPatternsChange: onPatternsChange, onPhrasesChange: onPhrasesChange });
      fbPanel = initFretboard(renderer, {
        panel: document.getElementById('fretboardPanel'),
        srcGuessed: document.getElementById('fbSrcGuessed'),
        srcWindow: document.getElementById('fbSrcWindow'),
        srcMatched: document.getElementById('fbSrcMatched'),
        srcPhrases: document.getElementById('fbSrcPhrases'),
        suppressChk: document.getElementById('fbSuppress'),
        octaveChk: document.getElementById('fbOctave'),
        playableChk: document.getElementById('fbPlayable'),
        noteNameChk: document.getElementById('fbNoteName'),
        resetBtn: document.getElementById('fbReset'),
        fullscreenBtn: document.getElementById('fbFullscreen'),
        pathSelect: document.getElementById('fbPaths'),
        prevBtn: document.getElementById('fbPrev'),
        nextBtn: document.getElementById('fbNext'),
        playStepBtn: document.getElementById('fbPlayStep'),
        autoPlayChk: document.getElementById('fbAutoPlayChk'),
        playBtn: document.getElementById('fbPlay'),
        speed: document.getElementById('fbSpeed'),
        shapePrev: document.getElementById('fbShapePrev'),
        shapeNext: document.getElementById('fbShapeNext'),
        stepLabel: document.getElementById('fbStepLabel'),
        shapeLabel: document.getElementById('fbShapeLabel'),
        msg: document.getElementById('fbMsg'),
        svg: document.getElementById('fbSvg'),
      }, {
        // Sound the current step as it reads on the sheet (chords stack, melody plays in sequence),
        // through the same player/instrument as the transport. `events` is [{midi, beat, durBeats}].
        playSequence: (events) => {
          if (!events || !events.length) return;
          const p = ensurePlayer();
          const instr = document.getElementById('instrSel').value;
          if (instr !== fbStepInstr) { p.setInstrument(instr); fbStepInstr = instr; }
          const spb = 60 / currentTempo();
          const base = Math.min(...events.map((e) => e.beat));
          const secs = events.map((e) => ({ midi: e.midi, time: (e.beat - base) * spb, duration: Math.max(0.15, (e.durBeats || 1) * spb) }));
          return p.playSequence(secs);
        },
      });
    }
    return renderer;
  }

  // ── Chord window (draggable selection over the staff) ──────────────────────────────────────
  let windowState = { chords: [], measureRange: null };   // latest payload from the renderer
  const windowPicks = new Set();                          // chord names the user picked to capture
  let globalChordMatch = false;   // "Global" toggle: picked chords highlight every occurrence sheet-wide
  // Fired by the renderer whenever the window moves/re-anchors: refresh chips + highlight + range.
  function onChordWindowChange(payload) {
    windowState = payload || { chords: [], measureRange: null };
    const names = new Set(windowState.chords.map((c) => c.name));
    [...windowPicks].forEach((n) => { if (!names.has(n)) windowPicks.delete(n); });   // drop vanished picks
    renderWindowChips();
    applyWindowHighlight();
    const r = windowState.measureRange;   // sequential → show printed
    document.getElementById('windowRange').textContent = r ? `(m. ${toPrintedMeasure(r[0])}–${toPrintedMeasure(r[1])})` : '';
  }
  function renderWindowChips() {
    const host = document.getElementById('windowChords');
    if (!host) return;
    host.innerHTML = '';
    if (!windowState.chords.length) { host.textContent = ' — '; return; }
    windowState.chords.forEach((c) => {
      const sel = windowPicks.has(c.name);
      const chip = document.createElement('button');
      chip.textContent = (sel ? '✓ ' : '') + chordDisplayName(c.name);
      chip.style.cssText = `margin:0 .15em; padding:.05em .4em; font-size:.85em; border-radius:3px; cursor:pointer; border:1px solid ${sel ? '#c62828' : '#1565c0'}; background:${sel ? '#ffe3e3' : '#eef4ff'}; color:${sel ? '#c62828' : '#1565c0'}`;
      chip.onclick = () => {
        if (windowPicks.has(c.name)) windowPicks.delete(c.name); else windowPicks.add(c.name);
        renderWindowChips();
        applyWindowHighlight();
      };
      host.appendChild(chip);
    });
  }
  function applyWindowHighlight() {
    if (!renderer) return;
    // The window and the overlay share one highlight channel; when the window is off, leave it
    // to the overlay (otherwise toggling Global would erase an overlay-selected highlight).
    if (!document.getElementById('chordWindowChk').checked) return;
    const picked = windowState.chords.filter((c) => windowPicks.has(c.name)).map((c) => c.name);
    renderer.clearHighlight();
    if (!picked.length) return;
    // Global: light up every occurrence of the picked chords across the sheet. Local: only the
    // window's own notes that form them.
    const notes = (globalChordMatch && renderer.occurrenceNotesForChords)
      ? renderer.occurrenceNotesForChords(picked)
      : windowState.chords.filter((c) => windowPicks.has(c.name)).reduce((acc, c) => acc.concat(c.notes || []), []);
    if (notes.length) renderer.highlightChord(notes);
  }
  // Auto-update chord picks while a saved vocab item is on screen. Writes the LOCAL cache only
  // (survives reload) — it does NOT push to GitHub, which would spam commits on every toggle.
  // The push happens later via "Add/update to vocab". No-op when capturing a fresh segment.
  function syncVocabChords(names) {
    if (!currentVocabEntry) return;
    currentVocabEntry.chords = names || [];
    vocab = upsertVocab(vocab, currentVocabEntry);
    renderVocab();
    if (store && store.putVocab) {
      try { const p = store.putVocab(system, vocab); if (p && p.catch) p.catch(() => {}); } catch (_) {}
    }
    setMediaMsg('Chords saved locally — Add/update to vocab to push', 'ok');
  }

  let player = null, yt = null, currentDetail = null, currentVocabEntry = null;
  let fbStepInstr = null;   // last instrument pushed to the player for fretboard step-play (avoids re-creating the voice)
  let fbPanel = null;       // fretboard panel controller (from initFretboard) — for cross-panel actions
  // The "Add to vocab" button doubles as "Add/update" while a saved vocab item is on screen.
  function updateAddVocabLabel() {
    const btn = document.getElementById('addVocabBtn');
    if (btn) btn.innerHTML = currentVocabEntry
      ? '<span class="ic">✎</span><span class="txt">Add/update to vocab</span>'
      : '<span class="ic">➕</span><span class="txt">Add to vocab</span>';
  }
  const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Toast notifications for media/vocab actions: stacked, auto-dismissing popups that float over the
  // page (replacing the old inline status pill). Tone sets the colour; errors linger longer; a toast
  // also dismisses on click. setMediaMsg keeps its (text, tone) signature so all call sites are unchanged.
  function toastHost() {
    let c = document.getElementById('toastHost');
    if (!c) {
      c = document.createElement('div');
      c.id = 'toastHost';
      // longhand positioning (not `inset`) for older mobile Safari; container ignores pointer events
      // so it never blocks the page, while each toast re-enables them to be click-dismissable.
      c.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:11000;'
        + 'display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw';
      document.body.appendChild(c);

  function chooseVocabAction(entryId) {

    document.getElementById('musicPreview').style.display = 'none';
    document.getElementById('suppressPanel').style.display = 'none';
    if (renderer) { renderer.setSuppressedNotes([]); renderer.setSuppressMode(false); }
    document.getElementById('suppressModeChk').checked = false;
    document.getElementById('hearAllChk').checked = false;
    syncToggles();
    document.body.classList.remove('preview-open');
  };
  // Toggle native fullscreen on the preview pane (webkit fallback for Safari).
  document.getElementById('previewFullscreenBtn').onclick = () => {
    const el = document.getElementById('musicPreview');
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    else { (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
  };
  // Re-fit the score to the (new) viewport width whenever fullscreen enters/exits.
  ['fullscreenchange', 'webkitfullscreenchange'].forEach((ev) => document.addEventListener(ev, () => {
    if (renderer && renderer.applyResponsiveZoom) renderer.applyResponsiveZoom(window.innerWidth);
  }));

  // ---- Search UI (Layout C) ----
  const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const QUALITIES = ['maj', 'min', 'dim', 'aug'];
  const EXTENSIONS = ['add9', '7', 'maj7', '6', '9', 'sus4'];

  function addChip() {
    const chip = document.createElement('div');
    chip.className = 'chordChip';
    const rootSel = document.createElement('select');
    NOTE_NAMES.forEach(n => rootSel.add(new Option(n, n)));
    const qualSel = document.createElement('select');
    QUALITIES.forEach(q => qualSel.add(new Option(q, q)));
    chip.appendChild(rootSel);
    chip.appendChild(qualSel);
    EXTENSIONS.forEach(ext => {
      const pill = document.createElement('button');
      pill.type = 'button'; pill.className = 'extPill'; pill.textContent = ext; pill.dataset.ext = ext;
      pill.onclick = () => pill.classList.toggle('active');
      chip.appendChild(pill);
    });
    const del = document.createElement('button');
    del.type = 'button'; del.textContent = '×'; del.onclick = () => chip.remove();
    chip.appendChild(del);
    document.getElementById('chips').appendChild(chip);
  }
  function readChips() {
    return Array.from(document.querySelectorAll('#chips .chordChip')).map(chip => {
      const sels = chip.querySelectorAll('select');
      return {
        root: sels[0].value, quality: sels[1].value,
        extensions: Array.from(chip.querySelectorAll('.extPill.active')).map(p => p.dataset.ext),
      };
    });
  }
  function buildNoteButtons() {
    const box = document.getElementById('noteButtons');
    const append = (tok) => { const t = document.getElementById('melodyTokens'); t.value = (t.value ? t.value + ' ' : '') + tok; };
    [...NOTE_NAMES, '.'].forEach(tok => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = tok; b.onclick = () => append(tok);
      box.appendChild(b);
    });
    const clr = document.createElement('button');
    clr.type = 'button'; clr.textContent = 'clear'; clr.onclick = () => { document.getElementById('melodyTokens').value = ''; };
    box.appendChild(clr);
  }
  function currentMode() {
    return document.querySelector('input[name="searchMode"]:checked').value;
  }
  function maxResultsVal() {
    const n = parseInt(document.getElementById('maxResults').value, 10);
    return Number.isFinite(n) && n > 0 ? n : undefined;
  }
  function buildQuery() {
    if (currentMode() === 'chord') {
      return buildChordQuery(readChips(), {
        strict_extensions: document.getElementById('strictExt').checked,
        max_gap: parseInt(document.getElementById('maxGap').value, 10) || 0,
        transpose_invariant: document.getElementById('transposeInv').checked,
        max_results: maxResultsVal(),
      });
    }
    const tokens = document.getElementById('melodyTokens').value.trim().split(/\s+/).filter(Boolean);
    return buildMelodyQuery(tokens, {
      search_by_interval: document.getElementById('byInterval').checked,
      pitch_tolerance: parseInt(document.getElementById('pitchTol').value, 10) || 0,
      max_results: maxResultsVal(),
    });
  }
  function renderResults(results) {
    const box = document.getElementById('results');
    if (!results.length) { box.innerHTML = '<em>No matches.</em>'; return; }
    box.innerHTML = '';
    results.forEach(r => {
      const title = (index.find(e => e.id === r.pieceId) || {}).title || r.pieceId;
      const row = document.createElement('div');
      row.className = 'resultRow';
      row.innerHTML = `<strong>${title}</strong><br><small>${matchSummary(r)}</small>`;
      row.onclick = () => openResult(r);
      box.appendChild(row);
    });
  }
  async function openResult(result) {
    await openPreview(result.pieceId);
    if (!currentDetail) return;   // note-text or failed render: detail pane shows its own message
    const mr = resolveMatchMeasures(currentDetail, result.match);   // sequential
    if (mr) {
      document.getElementById('segFrom').value = toPrintedMeasure(mr[0]);
      document.getElementById('segTo').value = toPrintedMeasure(mr[1]);
      if (renderer) renderer.showSegment(mr);
    }
  }
  async function openVocabEntry(entry) {
    await openPreview(entry.pieceId);
    if (!currentDetail) return;
    currentVocabEntry = entry;
    const from = entry.measureStart, to = entry.measureEnd;   // sequential (stored)
    document.getElementById('segFrom').value = toPrintedMeasure(from);
    document.getElementById('segTo').value = toPrintedMeasure(to);
    document.getElementById('vocabCat').value = (entry.category && entry.category !== 'uncategorized') ? entry.category : '';
    document.getElementById('vocabNote').value = entry.note || '';
    if (entry.startSeconds != null) document.getElementById('guessSec').value = entry.startSeconds;
    if (entry.endSeconds != null) document.getElementById('guessEndSec').value = entry.endSeconds;
    if (renderer) { renderer.showSegment([from, to]); renderer.highlightMeasures([from, to]); }
    if (renderer) renderer.setSuppressedNotes(entry.suppressed || []);
    document.getElementById('suppressModeChk').checked = false;
    document.getElementById('hearAllChk').checked = false;
    document.getElementById('voiceChips').style.display = 'none';
    document.getElementById('suppressPanel').style.display = '';
    syncToggles();           // reflect suppress-mode/hear-all buttons as off
    onSuppressionChange();   // refresh chips + hint
    // Restore the manually-picked chords: show the overlay and pre-select those labels.
    const savedChords = entry.chords || (entry.chord ? [entry.chord] : []);   // back-compat with old single-chord entries
    if (savedChords.length && renderer) {
      document.getElementById('chordChk').checked = true;
      renderer.setShowChords(true);
      renderer.setSelectedChords(savedChords);
    }
    syncToggles();   // reflect the (programmatic) Show-chords state on its toggle button
    updateAddVocabLabel();
  }
  // Delete a vocab item after confirmation: drop it locally, re-render, then push the new vocab.json.
  async function deleteVocabEntry(entry) {
    if (!window.confirm(`Delete vocab item “${entry.id}”?\n\nThis removes it for good.`)) return;
    vocab = vocab.filter(v => v.id !== entry.id);
    if (currentVocabEntry && currentVocabEntry.id === entry.id) { currentVocabEntry = null; updateAddVocabLabel(); }
    renderVocab();
    try { await store.putVocab(system, vocab); } catch (_) {}
    dirtyVocab = true; updatePushBtn();
    setMediaMsg(`Deleted “${entry.id}” locally — click "Push changes" to publish.`, 'ok');
  }
  function renderVocab() {
    const box = document.getElementById('vocabList');
    const groups = groupVocabByCategory(vocab);
    if (!groups.length) { box.innerHTML = '<em>No vocabulary yet.</em>'; return; }
    box.innerHTML = '';
    groups.forEach(g => {
      const h = document.createElement('div');
      h.innerHTML = `<strong>${g.category}</strong>`;
      box.appendChild(h);
      g.entries.forEach(e => {
        const title = (index.find(x => x.id === e.pieceId) || {}).title || e.pieceId;
        const mark = (e.startSeconds != null || e.youtube) ? ' ▶' : '';
        const noteHtml = e.note ? ` <small style="color:#666">— ${escapeHtml(e.note)}</small>` : '';
        const off = e.measureOffset || 0;   // show the item's PRINTED measure numbers
        const row = document.createElement('div');
        row.className = 'resultRow vocabRow';
        const label = document.createElement('span');
        label.className = 'vocabLabel';
        label.innerHTML = `${title} <small>m${e.measureStart - off}–${e.measureEnd - off}${mark}</small>${noteHtml}`;
        label.onclick = () => openVocabEntry(e);
        const del = document.createElement('button');
        del.className = 'vocabDel'; del.title = 'Delete this vocab item'; del.textContent = '🗑';
        del.onclick = (ev) => { ev.stopPropagation(); deleteVocabEntry(e); };
        row.appendChild(label);
        row.appendChild(del);
        box.appendChild(row);
      });
    });
  }
  document.querySelectorAll('input[name="searchMode"]').forEach(radio => {
    radio.onchange = () => {
      document.getElementById('chordMode').style.display = currentMode() === 'chord' ? '' : 'none';
      document.getElementById('melodyMode').style.display = currentMode() === 'melody' ? '' : 'none';
    };
  });
  document.getElementById('addChipBtn').onclick = addChip;
  document.getElementById('searchBtn').onclick = () => {
    let query;
    try { query = buildQuery(); } catch (e) { document.getElementById('searchMsg').textContent = e.message; return; }
    let results;
    try { results = runQuery(query, filterByTags(index, tagFilter)); }
    catch (e) { document.getElementById('searchMsg').textContent = 'Invalid query: ' + e.message; return; }
    const tagNote = tagFilter.size ? ` (tags: ${[...tagFilter].join(', ')})` : '';
    document.getElementById('searchMsg').textContent = `${results.length} match${results.length === 1 ? '' : 'es'}${tagNote}`;
    renderResults(results);
  };
  addChip();            // start with one chord chip
  buildNoteButtons();   // populate the melody note-picker

  (async () => {
    try { const lib = await loadLibrary(system, store); index = lib.index; unpushedIds = lib.unpushedIds; }
    catch (_) { index = []; unpushedIds = new Set(); }
    try { vocab = await loadVocab(system, store); } catch (_) { vocab = []; }
    try { tagRegistry = await loadTagRegistry(); } catch (_) { tagRegistry = []; }
    if (renderer) renderer.setTagRegistry(tagRegistry);   // (renderer is lazy; ensureRenderer also seeds it)
    render(); updatePushBtn(); renderVocab();
  })();
</script>
</body>
</html>
